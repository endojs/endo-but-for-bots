# A bounded, resumable whole-tree sweep runs nightly with a committed
# per-mode expectation ratchet. Manual bounded subtrees remain useful for
# investigation; ordinary PR CI gates the complete checked-in Ironhorse corpus.
name: Ironhorse full test262 sweep

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      subtree:
        description: 'Subtree to sweep (e.g. built-ins/Proxy), or "full" for the whole tree'
        required: false
        default: 'built-ins/Proxy'
        type: string
      jobs:
        description: 'Batch parallelism (bounds peak memory: concurrent oracle processes)'
        required: false
        default: '4'
        type: string
      oracle:
        description: 'Gate on the XS oracle (on/off)'
        required: false
        default: 'on'
        type: choice
        options:
          - 'on'
          - 'off'

# Minimal permissions: read the checkout, nothing else. The report is uploaded
# as a build artifact; publishing it to gh-pages is a separate, deliberate step.
permissions:
  contents: read

# Defense in depth against npm lifecycle scripts (repo convention, see
# designs/ci-no-npm-lifecycle.md). This workflow does not run yarn, but the
# posture is kept uniform across workflows.
env:
  YARN_ENABLE_SCRIPTS: 'false'
  npm_config_ignore_scripts: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.subtree }}
  cancel-in-progress: false

jobs:
  sweep:
    name: sweep
    runs-on: ubuntu-latest
    # A whole-tree run is substantial; a bounded subtree finishes quickly. Cap so a
    # runaway can't burn a full day of runner time.
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The XS oracle links the moddable C submodule.
          submodules: true

      - name: Cache Cargo downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-ih262-cargo-${{ hashFiles('rust/engine/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-ih262-cargo-

      - name: Run the sweep
        env:
          SUBTREE: ${{ github.event.inputs.subtree }}
          JOBS: ${{ github.event.inputs.jobs }}
          ORACLE: ${{ github.event.inputs.oracle }}
        run: |
          set -euo pipefail
          arguments=(--output "$GITHUB_WORKSPACE/test262-report" --jobs "${JOBS:-4}" --oracle "${ORACLE:-on}")
          SUBTREE="${SUBTREE:-full}"
          if [ "${SUBTREE}" != "full" ]; then
            arguments+=(--subtree "${SUBTREE}")
          elif [ "${ORACLE:-on}" = "on" ]; then
            arguments+=(--expectations-dir "$GITHUB_WORKSPACE/rust/engine/ironhorse-262/expectations/whole-tree")
          fi
          bash rust/engine/ironhorse-262/scripts/full-run.sh "${arguments[@]}"

      - name: Summarize
        if: always()
        run: |
          set -euo pipefail
          report="$GITHUB_WORKSPACE/test262-report/report.json"
          if [ -f "$report" ]; then
            echo '## Ironhorse test262 sweep' >> "$GITHUB_STEP_SUMMARY"
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            sed -n '/"summary"/,/^  },$/p' "$report" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'No report.json produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ironhorse-test262-report
          path: |
            test262-report/report.json
            test262-report/report.html
            test262-report/provenance.json
          if-no-files-found: warn

      # Preserve the validated resume state (the completed per-batch results) and
      # the per-batch diagnostics even when the sweep did NOT finish, so a whole-
      # tree run interrupted by the job limit is not lost: download this
      # artifact, restore it under a local `--output`, and re-run `full-run.sh` to
      # resume from exactly what completed (a batch is bound to its run identity,
      # so only work matching this corpus/engine/oracle/scope is reused). Cross-
      # dispatch resume is deliberately a manual restore — GitHub Actions cache is
      # keyed immutably and cannot accumulate partial state across dispatches — so
      # the whole-tree sweep's canonical home is a long-lived local/self-hosted run
      # (see rust/engine/ironhorse-262/scripts/README.md, "CI").
      - name: Upload resume state + diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ironhorse-test262-resume-state
          path: |
            test262-report/results/**
            test262-report/logs/**
            test262-report/attempts/**
            test262-report/quarantines/**
            test262-report/ratchets/**
            test262-report/discovery.txt
            test262-report/pending.txt
          if-no-files-found: warn

  # In-process engine instruments only. The fourth daemon arm is explicitly
  # blocked on F054 host-function registration and the stage-4 SES boot bundle.
  benchmarks:
    name: Performance baselines and scaling
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # Match the documented local before/after measurement environment.
      CARGO_INCREMENTAL: '0'
      RUST_MIN_STACK: '33554432'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The baseline revision is remeasured on the same host as the candidate.
          fetch-depth: 0
      - name: Test benchmark checker
        run: python3 -m unittest discover -s rust/engine/benches -p 'test_*.py'
      - name: Check snapshot performance baselines
        run: |
          set -euo pipefail
          python3 rust/engine/benches/run.py --reference-baseline --check-baseline --output benchmark-report.json 2>&1 | tee benchmark.log
      - name: Check elapsed time and computron scaling
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/engine/Cargo.toml --locked --release -p ironhorse-snapshot --test scaling_bench -- --ignored --nocapture --test-threads=1 2>&1 | tee scaling.log
      - name: Check unchanged checkpoint scaling
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/engine/Cargo.toml --locked --release -p ironhorse-snapshot --test checkpoint_scaling_bench -- --ignored --nocapture --test-threads=1 2>&1 | tee checkpoint-scaling.log
      - name: Check existing-property update scaling
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/engine/Cargo.toml --locked --release -p ironhorse-snapshot --test property_lookup_bench -- --ignored --nocapture --test-threads=1 2>&1 | tee property-lookup.log
      - name: Check compiler scaling
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/engine/Cargo.toml --locked --release -p ironhorse-compile --test performance_bench -- --ignored --nocapture --test-threads=1 2>&1 | tee compiler-scaling.log
      - name: Check shared-bytecode lifecycle scaling
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/engine/Cargo.toml --locked --release -p ironhorse-snapshot --test lifecycle_bench -- --ignored --nocapture --test-threads=1 2>&1 | tee lifecycle.log
      - name: Measure property and call classification
        if: ${{ !cancelled() }}
        run: |
          set -euo pipefail
          cargo test --manifest-path rust/engine/Cargo.toml --locked --release -p ironhorse-snapshot --test classification_bench -- --ignored --nocapture --test-threads=1 2>&1 | tee classification.log
      - name: Upload performance measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ironhorse-performance
          path: |
            benchmark-report.json
            benchmark.log
            scaling.log
            compiler-scaling.log
            lifecycle.log
            classification.log
            property-lookup.log
            checkpoint-scaling.log
          if-no-files-found: error
