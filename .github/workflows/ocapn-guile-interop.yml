name: OCapN Guile interop

# Mirrors the `test-ocapn-python` job in ci.yml but drives Endo `@endo/ocapn`
# as a client joining a Goblins (Guile)-hosted chatroom over the websocket netlayer.
#
# This currently targets Spritely git repos directly (both goblins + goblin-chat),
# pinned by commit. The flow asserts full Guile-hosted/Endo-joined interoperability:
# sturdyref publication, websocket session establishment, and bilateral message exchange.
#
# Because those repos come from a third-party forge, the job can also pass
# without having tested anything: when Codeberg serves none of the pinned
# sources, every step after "Obtain Spritely" is skipped and the run says so
# in its summary. See the comment on that step for what is and is not
# tolerated that way.

on:
  pull_request:
    paths:
      - 'packages/ocapn/**'
      - 'packages/goblin-chat/**'
      - '.github/workflows/ocapn-guile-interop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Defense in depth against npm lifecycle scripts running implicitly at install.
  # .yarnrc.yml sets `enableScripts: false` at rest; these env vars ensure the
  # posture survives a branch that drops the repo-level config, an invocation of
  # npm where yarn was intended, or a workflow that unsets the yarn config.
  # See designs/ci-no-npm-lifecycle.md.
  YARN_ENABLE_SCRIPTS: 'false'
  npm_config_ignore_scripts: 'true'
  # The Spritely sources, pinned by commit. Each commit is paired with the
  # git tree hash it names, which is what every source of those bytes is
  # checked against; see the "Obtain Spritely" step below. To bump a pin,
  # update the commit and read back the matching tree with
  # `git rev-parse <commit>^{tree}`. The two must move together.
  GOBLINS_COMMIT: 'd42d3a4ff560ecd2a1ac8ef0e44e52ad9e20bdb6'
  GOBLINS_TREE: '1131bfb6430766c7c864652386ac9cfdd4149027'
  GOBLIN_CHAT_COMMIT: 'fd0b3fcec186e54f978fb24b23bb46a65ae2e0a7'
  GOBLIN_CHAT_TREE: '52c7cc063e8c708edff49e3dc3939a96648c8082'
  # Pin to a specific Guix release rather than tracking nightly. The
  # nightly tarball lives behind `ci.guix.gnu.org`, which periodically
  # returns sustained 502s for hours and which is also the substitute
  # server the daemon talks to at runtime; coupling install to the same
  # host as substitutes turned a substitute outage into a hard CI
  # failure. The pinned release is mirrored on `ftp.gnu.org`, which is
  # operationally independent. Bump `GUIX_VERSION` to update; the
  # corresponding sha256 must be refreshed at the same time.
  GUIX_VERSION: '1.5.0'
  GUIX_TARBALL_SHA256: 'aa41025489c5061543e9c48873eaa829b900b2da75d40f9648913622f5f47817'

jobs:
  test-ocapn-guile-interop:
    name: test-ocapn-guile-interop
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout Endo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: endo
          persist-credentials: false

      # Both Spritely repos are hosted on Codeberg and pinned to explicit
      # commits, so CI stays deterministic while still tracking git
      # repositories directly. A plain `git clone` of them was this job's
      # first step and its most fragile: on 2026-09-08 Codeberg's git
      # endpoint answered `504 Bad Gateway` and the job died before doing
      # any work. Three layers now sit between that outage and a red run.
      #
      #   1. A cache keyed on the pinned commits. The commits are
      #      immutable, so a hit is always correct and most runs never
      #      contact Codeberg at all. Pull request runs can read caches
      #      saved on the base branch.
      #   2. Two independent Codeberg endpoints per repo. A depth-1 fetch
      #      of just the pinned commit is tried first, then
      #      `/archive/<commit>.tar.gz`, which Forgejo serves from its
      #      archive cache without going through `git-upload-pack` at all.
      #      During the 504 window above the archive endpoint served these
      #      exact commits normally, so the two fail independently.
      #   3. If no source serves them, the job is skipped rather
      #      than failed: an upstream forge being down is not a result
      #      about this pull request. Every later step carries the
      #      matching `if:`, so nothing runs half-configured.
      #
      # As with the Guix tarball below, the trust anchor is the pinned hash
      # and not the source: bytes are accepted only if they reconstruct the
      # tree of the pinned commit. The git path gets that check from git
      # itself; the archive path, which is otherwise only as good as the
      # transport, is held to the same value, and so is a restored cache.
      #
      # A pin that no longer resolves is a different failure and must not
      # be swallowed by the skip: when Codeberg answers but reports the
      # commit gone (an upstream force-push, a rename), this step fails
      # loudly instead, because that one is actionable here.
      #
      # The GitLab mirrors are no use as a third source: they stopped
      # tracking upstream in 2024 (goblins) and 2022 (goblin-chat) and
      # contain neither pinned commit. Software Heritage has the goblins
      # revision but not goblin-chat's, and extracting a tree from it needs
      # the asynchronous vault-cooking API.
      - name: Restore Spritely source cache
        id: spritely-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            goblins
            goblin-chat
          key: spritely-source-${{ env.GOBLINS_COMMIT }}-${{ env.GOBLIN_CHAT_COMMIT }}

      - name: Obtain Spritely Goblins + goblin-chat
        id: spritely
        env:
          # Empty rather than 'true' when the cache missed.
          CACHE_HIT: ${{ steps.spritely-cache.outputs.cache-hit }}
          # Worst case per repo is ATTEMPTS x both source timeouts plus the
          # waits between attempts -- 3 x 120s + 2 x 20s, under seven
          # minutes -- so even with every source timing out, both repos
          # resolve well inside the job's 45-minute budget. Nothing
          # expensive has run yet at this point, and nothing will if this
          # step reports the sources unavailable.
          ATTEMPTS: '3'
          RETRY_WAIT: '20'
          SOURCE_TIMEOUT: '60'
        run: |
          set -uo pipefail

          # Reconstruct the git tree hash of a plain directory, so bytes
          # from the git endpoint, from the archive endpoint and from the
          # cache are all held to the same pinned value. The index and
          # object store live outside the tree, so verifying leaves nothing
          # behind for the Guile load path to trip over.
          tree_hash() { # dir
            local scratch
            scratch="$(mktemp -d)"
            git init -q --bare "$scratch/git" || return 1
            # `-f` so a `.gitignore` inside the tree cannot drop a tracked
            # file from the reconstruction and turn a mismatch into a pass.
            GIT_DIR="$scratch/git" GIT_WORK_TREE="$1" GIT_INDEX_FILE="$scratch/index" \
              git -c core.bare=false add -A -f || return 1
            GIT_DIR="$scratch/git" GIT_INDEX_FILE="$scratch/index" git write-tree
          }

          verify_tree() { # dir expected-tree
            local got
            got="$(tree_hash "$1")" || return 1
            [ -n "$got" ] && [ "$got" = "$2" ]
          }

          from_git() { # dir slug commit
            rm -rf "$1"
            mkdir -p "$1"
            git -C "$1" init -q &&
              timeout "$SOURCE_TIMEOUT" git -C "$1" fetch -q --depth 1 \
                "https://codeberg.org/$2" "$3" &&
              git -C "$1" checkout -q --detach FETCH_HEAD || return 1
            # Only the working tree is used downstream, and dropping `.git`
            # keeps both sources shaped identically for the cache.
            rm -rf "$1/.git"
          }

          from_tarball() { # dir slug commit
            rm -rf "$1" "$1.tar.gz"
            mkdir -p "$1"
            timeout "$SOURCE_TIMEOUT" curl -fsSL --max-time "$SOURCE_TIMEOUT" \
              "https://codeberg.org/$2/archive/$3.tar.gz" -o "$1.tar.gz" &&
              tar -xzf "$1.tar.gz" --strip-components=1 -C "$1"
          }

          obtain() { # dir slug commit tree
            local attempt source
            for attempt in $(seq 1 "$ATTEMPTS"); do
              for source in from_git from_tarball; do
                if "$source" "$1" "$2" "$3" && verify_tree "$1" "$4"; then
                  echo "$1: $source served tree $4 (attempt $attempt)"
                  return 0
                fi
                echo "::warning::$1: $source did not yield tree $4 (attempt $attempt of $ATTEMPTS)"
              done
              if [ "$attempt" -lt "$ATTEMPTS" ]; then sleep "$RETRY_WAIT"; fi
            done
            rm -rf "$1"
            return 1
          }

          # Forgejo's API answers 200 for a commit it holds and 404 for one
          # it does not, which separates "the forge is degraded" from "the
          # pin is stale". Anything else (5xx, a timeout, no answer at all)
          # is inconclusive and therefore treated as degraded.
          pin_state() { # slug commit -> live | absent | unknown
            local code
            code="$(timeout 45 curl -sS -o /dev/null -w '%{http_code}' --max-time 30 \
              "https://codeberg.org/api/v1/repos/$1/git/commits/$2" 2>/dev/null || true)"
            case "$code" in
            200) echo live ;;
            404) echo absent ;;
            *) echo unknown ;;
            esac
          }

          fetched=false
          if [ "${CACHE_HIT:-}" = 'true' ] &&
            verify_tree goblins "$GOBLINS_TREE" &&
            verify_tree goblin-chat "$GOBLIN_CHAT_TREE"; then
            status=ok
            echo 'Restored both Spritely source trees from cache; pinned trees verified.'
          else
            if [ "${CACHE_HIT:-}" = 'true' ]; then
              echo '::warning::Cached Spritely sources do not match the pinned trees; refetching.'
            fi
            if obtain goblins spritely/goblins "$GOBLINS_COMMIT" "$GOBLINS_TREE" &&
              obtain goblin-chat spritely/goblin-chat "$GOBLIN_CHAT_COMMIT" "$GOBLIN_CHAT_TREE"; then
              status=ok
              fetched=true
            elif [ "$(pin_state spritely/goblins "$GOBLINS_COMMIT")" = absent ] ||
              [ "$(pin_state spritely/goblin-chat "$GOBLIN_CHAT_COMMIT")" = absent ]; then
              status=stale-pin
            else
              status=unavailable
            fi
          fi

          case "$status" in
          ok)
            printf 'available=true\nfetched=%s\n' "$fetched" >> "$GITHUB_OUTPUT"
            ;;
          stale-pin)
            echo '::error::Codeberg is answering, but no longer resolves a commit pinned by this workflow. Update GOBLINS_COMMIT/GOBLINS_TREE or GOBLIN_CHAT_COMMIT/GOBLIN_CHAT_TREE.'
            exit 1
            ;;
          *)
            printf 'available=false\nfetched=false\n' >> "$GITHUB_OUTPUT"
            echo '::warning::Could not obtain the pinned Spritely sources from Codeberg; skipping the Guile interop test. This is an upstream availability failure, not a result about this pull request.'
            {
              echo '### OCapN Guile interop skipped'
              echo
              echo 'No Codeberg source served the pinned Spritely commits, so the'
              echo 'interop test did not run. Nothing here says anything about this'
              echo 'pull request; re-run the job once Codeberg recovers.'
            } >> "$GITHUB_STEP_SUMMARY"
            ;;
          esac

      - name: Save Spritely source cache
        # Saved from the pristine trees, before the compatibility `sed`s in
        # the host step below edit them in place, so that a later restore
        # can be held to the same pinned tree hashes. A concurrent run may
        # have claimed the key first; that is a warning, not a failure.
        if: steps.spritely.outputs.fetched == 'true'
        continue-on-error: true
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            goblins
            goblin-chat
          key: spritely-source-${{ env.GOBLINS_COMMIT }}-${{ env.GOBLIN_CHAT_COMMIT }}

      - if: steps.spritely.outputs.available == 'true'
        run: corepack enable
        working-directory: endo

      - name: Use Node.js 20.17.x
        if: steps.spritely.outputs.available == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.17.x
          cache: yarn
          cache-dependency-path: endo/yarn.lock

      - name: Install Node dependencies
        if: steps.spritely.outputs.available == 'true'
        working-directory: endo
        run: yarn install --immutable

      - name: Build Endo
        if: steps.spritely.outputs.available == 'true'
        working-directory: endo
        run: yarn build

      # `PromyLOPh/guix-install-action` is a composite action whose
      # `Download` step wgets the Guix nightly tarball from
      # `ci.guix.gnu.org`. The action has no internal retry;
      # `Wandalen/wretry.action` cannot wrap composite actions; and
      # `nick-fields/retry` only wraps shell commands, not `uses:`
      # blocks. We inline the action's steps so the wget is a plain
      # shell step we can cache, wrap in `nick-fields/retry`, and
      # (most importantly) point at a pinned stable release on
      # `ftp.gnu.org` rather than the nightly tarball on
      # `ci.guix.gnu.org`.
      - name: Set LANG
        if: steps.spritely.outputs.available == 'true'
        run: echo LANG=en_US.utf8 >> $GITHUB_ENV
      - name: Restore Guix tarball cache
        if: steps.spritely.outputs.available == 'true'
        id: guix-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: guix-binary.x86_64-linux.tar.xz
          # Cache key includes the version and sha256 so a version
          # bump or upstream re-publish forces a fresh download.
          key: guix-binary-x86_64-linux-${{ env.GUIX_VERSION }}-${{ env.GUIX_TARBALL_SHA256 }}
      - name: Download Guix stable tarball
        # `ftpmirror.gnu.org/guix/` redirects to an available GNU mirror
        # for release binaries. It is operationally independent
        # from `ci.guix.gnu.org` (the substitute server), so a
        # substitute outage does not block the install path.
        #
        # The redirector is itself a single host, though. On
        # 2026-09-06 and 2026-09-07 it answered `502 Bad Gateway` from
        # its own front end, on and off for hours (no redirect was
        # ever issued, and other GNU packages were affected too),
        # while `ftp.gnu.org` and the mirrors behind it served this
        # exact tarball normally; every one of the six retries against
        # the redirector alone failed. So each attempt now walks a
        # list of sources for the same bytes: the redirector first (it
        # spreads load across the mirror network), then the origin
        # `ftp.gnu.org`, then a well-known mirror. The trust anchor is
        # `GUIX_TARBALL_SHA256`, not the source: a host is only ever an
        # alternative way to obtain bytes, and whatever it serves is
        # accepted only if it hashes to the pinned value.
        #
        # The download writes to `.tmp` and only renames after the
        # sha256 verifies, so a truncated or replaced file cannot
        # masquerade as a valid tarball. `rm -f` of the `.tmp` before
        # each source, and of both files before each retry attempt,
        # means a partial download from one source can never be
        # mistaken for the output of the next.
        #
        # `--timeout`/`--tries` bound how long a hung source can hold
        # an attempt (wget's defaults are 900 seconds and 20 tries),
        # so the fallback is reached well inside `timeout_minutes`.
        # Each attempt already spans three hosts, so fewer outer
        # attempts are needed than before: the worst case is
        # 3 attempts x 6 minutes plus two 30-second waits, 19 minutes,
        # inside the job's 45-minute budget.
        if: steps.spritely.outputs.available == 'true' && steps.guix-cache.outputs.cache-hit != 'true'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_minutes: 6
          command: |
            set -euo pipefail
            rm -f guix-binary.x86_64-linux.tar.xz.tmp guix-binary.x86_64-linux.tar.xz
            TARBALL="guix-binary-${GUIX_VERSION}.x86_64-linux.tar.xz"
            for url in \
              "https://ftpmirror.gnu.org/guix/${TARBALL}" \
              "https://ftp.gnu.org/gnu/guix/${TARBALL}" \
              "https://mirrors.kernel.org/gnu/guix/${TARBALL}"
            do
              rm -f guix-binary.x86_64-linux.tar.xz.tmp
              if wget -nv --timeout=30 --tries=1 "${url}" -O guix-binary.x86_64-linux.tar.xz.tmp \
                && file guix-binary.x86_64-linux.tar.xz.tmp | grep -q 'XZ compressed data' \
                && echo "${GUIX_TARBALL_SHA256}  guix-binary.x86_64-linux.tar.xz.tmp" | sha256sum --check --strict
              then
                mv guix-binary.x86_64-linux.tar.xz.tmp guix-binary.x86_64-linux.tar.xz
                echo "Fetched and verified ${TARBALL} from ${url}"
                exit 0
              fi
              echo "::warning::${url} did not yield ${TARBALL} matching GUIX_TARBALL_SHA256; trying the next source"
            done
            echo "::error::No source served ${TARBALL} matching GUIX_TARBALL_SHA256"
            exit 1
      - name: Verify cached tarball checksum
        if: steps.spritely.outputs.available == 'true'
        # Belt-and-suspenders: if a previous run cached a different
        # blob (for example because someone updated `GUIX_VERSION`
        # without bumping `GUIX_TARBALL_SHA256`, or vice versa), we
        # want to fail loud here rather than installing the wrong
        # bytes.
        run: |
          set -euo pipefail
          echo "${GUIX_TARBALL_SHA256}  guix-binary.x86_64-linux.tar.xz" | sha256sum --check --strict
      - name: Install Guix
        if: steps.spritely.outputs.available == 'true'
        run: |
          sudo -- tar --extract --file "guix-binary.x86_64-linux.tar.xz" -C / --no-overwrite-dir
          sudo -- groupadd --system guixbuild

          for i in $(seq -w 1 10); do
              sudo useradd -g guixbuild -G guixbuild -d /var/empty -s "$(which nologin)" -c "Guix build user $i" --system "guixbuilder${i}"
          done

          export GUIX_PATH=/var/guix/profiles/per-user/root/current-guix

          sudo cp "$GUIX_PATH/lib/systemd/system/gnu-store.mount" /etc/systemd/system/
          # Configure the daemon with both substitute servers up front
          # so degradation of one does not block the other. The order
          # below puts `ci.guix.gnu.org` first because the daemon's
          # per-item slow path is "first server unreachable" (each
          # lookup eats a connection timeout before falling through),
          # not "first server returns 5xx", and the recent failure
          # window (2026-05-14) saw sustained "Network is unreachable"
          # from `bordeaux.guix.gnu.org` while `ci.guix.gnu.org` served
          # substitutes normally. The asymmetry is acceptable: when
          # `ci.guix.gnu.org` is the one degraded (the failure mode
          # iteration I in #82 originally addressed), the daemon still
          # falls back to `bordeaux.guix.gnu.org`. Both keys are
          # authorized below from the tarball's bundled
          # `share/guix/*.pub` files. `--fallback` is a client-side
          # flag (e.g. for `guix build`) and is rejected by the
          # daemon, so it goes on the build invocations themselves
          # rather than here.
          cat <<'EOF' | sudo tee /etc/systemd/system/guix-daemon.service > /dev/null
          # Service unit file for guix-daemon, modeled on the upstream
          # template in the Guix install tarball but with explicit
          # substitute URLs.

          [Unit]
          Description=Build daemon for GNU Guix

          [Service]
          ExecStart=/var/guix/profiles/per-user/root/current-guix/bin/guix-daemon \
              --build-users-group=guixbuild --discover=yes \
              --substitute-urls='https://ci.guix.gnu.org https://bordeaux.guix.gnu.org'
          Environment='GUIX_LOCPATH=/var/guix/profiles/per-user/root/guix-profile/lib/locale' LC_ALL=en_US.utf8

          StandardOutput=syslog
          StandardError=syslog

          OOMPolicy=continue

          Restart=always

          TasksMax=8192

          [Install]
          WantedBy=multi-user.target
          EOF
          sudo chmod 664 /etc/systemd/system/gnu-store.mount /etc/systemd/system/guix-daemon.service
          sudo systemctl daemon-reload
          sudo systemctl enable --now gnu-store.mount guix-daemon.service

          echo "$GUIX_PATH/bin" >> "$GITHUB_PATH"
      - name: Authorize build farm
        if: steps.spritely.outputs.available == 'true'
        # Authorizes both ci.guix.gnu.org and bordeaux.guix.gnu.org;
        # both .pub files ship inside the Guix tarball under
        # share/guix/.
        run: |
          for F in /var/guix/profiles/per-user/root/current-guix/share/guix/*.pub; do
              sudo /var/guix/profiles/per-user/root/current-guix/bin/guix archive --authorize < "$F"
          done
      - name: Generate keys
        if: steps.spritely.outputs.available == 'true'
        run: sudo /var/guix/profiles/per-user/root/current-guix/bin/guix archive --generate-key

      - name: Report Guix version
        if: steps.spritely.outputs.available == 'true'
        run: guix describe || guix --version

      # The substitute fetches that follow inherit `--substitute-urls`
      # from the daemon, so they consult `bordeaux.guix.gnu.org` when
      # `ci.guix.gnu.org` is degraded (and vice-versa, per the daemon
      # unit's reordered list above). We pass `--fallback` per
      # invocation to permit local builds when neither server has the
      # requested item. The retry wrapper guards against transient
      # daemon errors during the ci <-> bordeaux handoff, and against
      # the daemon socket not being ready for the first few seconds
      # after Install.
      - name: Resolve Guix module paths
        if: steps.spritely.outputs.available == 'true'
        uses: nick-fields/retry@ad984534de44a9489a53aefd81eb77f87c70dc60 # v4.0.0
        with:
          max_attempts: 3
          retry_wait_seconds: 30
          timeout_minutes: 20
          # Run each `guix build` and assert non-empty output before
          # trusting it: command substitution doesn't propagate
          # non-zero exits through `echo`, so without an explicit
          # check, an empty result silently flows into $GITHUB_ENV
          # and only fails much later when downstream steps cannot
          # locate the modules. Promote to $GITHUB_ENV only after all
          # four resolutions succeed, so retries stay idempotent.
          command: |
            set -euo pipefail
            shopt -s inherit_errexit
            wait_for_daemon() {
              for i in $(seq 1 30); do
                if [ -S /var/guix/daemon-socket/socket ]; then return 0; fi
                sleep 1
              done
              echo "guix-daemon socket never appeared at /var/guix/daemon-socket/socket" >&2
              sudo systemctl status guix-daemon.service --no-pager || true
              return 1
            }
            resolve() {
              local pkg="$1"
              local out
              out="$(guix build --fallback "$pkg" | tail -n 1)"
              if [ -z "$out" ]; then
                echo "guix build $pkg returned empty output" >&2
                return 1
              fi
              printf '%s\n' "$out"
            }
            wait_for_daemon
            # Resolve into named variables so `set -e` + `inherit_errexit`
            # propagate failures from inside the command substitutions.
            # An earlier draft inlined `$(resolve …)` inside `echo "VAR=$(…)"`,
            # but `echo` always succeeds, so an empty resolution would silently
            # poison `$GITHUB_ENV` instead of triggering a retry.
            FIBERS=$(resolve guile-fibers)
            WEBSOCKET=$(resolve guile-websocket)
            GNUTLS=$(resolve guile-gnutls)
            GCRYPT=$(resolve guile-gcrypt)
            scratch="$(mktemp)"
            {
              echo "FIBERS_OUT=$FIBERS"
              echo "WEBSOCKET_OUT=$WEBSOCKET"
              echo "GNUTLS_OUT=$GNUTLS"
              echo "GCRYPT_OUT=$GCRYPT"
            } > "$scratch"
            cat "$scratch" >> "$GITHUB_ENV"

      - name: Start Guile goblin-chat host
        if: steps.spritely.outputs.available == 'true'
        working-directory: endo
        env:
          INTEROP_CLIENT: ${{ github.workspace }}/endo/packages/goblin-chat/test/guile-interop/interop-client.scm
          GOBLINS_REPO: ${{ github.workspace }}/goblins
          GOBLIN_CHAT_REPO: ${{ github.workspace }}/goblin-chat
        run: |
          # Generate module expected by latest goblins source checkout.
          DOT_PATH="$(command -v dot || echo dot)"
          sed "s|@DOT@|$DOT_PATH|g" \
            "$GOBLINS_REPO/goblins/config.scm.in" \
            > "$GOBLINS_REPO/goblins/config.scm"

          # Runtime compatibility shim while goblin-chat imports the legacy
          # module path `(goblins ghash)`. Goblins moved the module to
          # `(goblins utils ghash)` in v0.16.0 (commit 5587721, 2025-04-30)
          # but goblin-chat has not yet been updated. Drop this once the
          # upstream fix lands: https://codeberg.org/spritely/goblin-chat/pulls/17
          sed -i 's/(goblins ghash)/(goblins utils ghash)/' \
            "$GOBLIN_CHAT_REPO/goblin-chat/backend.scm"

          # Use a non-default port to reduce cross-job collisions.
          OCAPN_TEST_PORT=26804

          # Goblins from raw git source has exhibited interpreter-only failures
          # with auto-compile disabled; allow Guile to compile modules first.
          # `--fallback` permits local builds when neither substitute server
          # has the requested item (it is a client flag, not a daemon flag).
          # The 600s upper bound covers the `guix shell` startup (substitute
          # fetch + local build of any missing item) plus the Guile host's
          # steady-state lifetime while the Endo client connects. The
          # polling-for-sturdyref loop below caps the startup portion at
          # 240s and leaves at least 360s for the Endo client to drive the
          # interop, which the Endo step itself bounds at 120s.
          OCAPN_TEST_PORT="$OCAPN_TEST_PORT" GUILE_AUTO_COMPILE=1 \
            timeout 600s guix shell --pure --no-grafts --fallback \
            --preserve='^OCAPN_TEST_PORT$|^GUILE_AUTO_COMPILE$' \
            guile guile-fibers guile-websocket guile-gnutls guile-gcrypt -- \
            guile \
              -L "$FIBERS_OUT/share/guile/site/3.0" \
              -L "$WEBSOCKET_OUT/share/guile/site/3.0" \
              -L "$GNUTLS_OUT/share/guile/site/3.0" \
              -L "$GCRYPT_OUT/share/guile/site/3.0" \
              -L "$GOBLINS_REPO" \
              -L "$GOBLIN_CHAT_REPO" \
              "$INTEROP_CLIENT" \
              "hello from Guile CI" "hello from Endo OCapN" \
              > /tmp/guile-interop.log 2>&1 &
          echo $! > /tmp/guile-interop.pid
          # Wait for the Guile host to advertise its sturdyref. The
          # previous 120-second ceiling was tight in the nominal case
          # but tripped before `guix shell` could finish its
          # substitute fetch on degraded-substitute-network days
          # (2026-05-14: `bordeaux.guix.gnu.org` connection-timeouts
          # added per-item overhead to every fetch, pushing the
          # sturdyref publication past 120 seconds despite the daemon
          # eventually completing). 240 seconds covers the slow path
          # without inflating the nominal-case runtime; the `kill -0`
          # guard breaks the loop early when the background process
          # dies for any reason, so a hung 240-second wait is
          # impossible in practice. The outer `timeout 600s` on the
          # `guix shell` invocation above is the absolute upper bound.
          for i in $(seq 1 240); do
            if grep -q 'sturdyref:' /tmp/guile-interop.log; then break; fi
            if ! kill -0 "$(cat /tmp/guile-interop.pid)" 2>/dev/null; then break; fi
            sleep 1
          done
          cat /tmp/guile-interop.log
          STURDYREF=$(sed -n 's/.*sturdyref: \(ocapn:[^ ]*\).*/\1/p' /tmp/guile-interop.log | head -n1)
          if [ -z "$STURDYREF" ]; then
            echo "Failed to read sturdyref from Guile host log"
            exit 1
          fi
          echo "STURDYREF=$STURDYREF" >> $GITHUB_ENV

      - name: Run Endo interop client
        if: steps.spritely.outputs.available == 'true'
        working-directory: endo
        env:
          # Newer Goblins reports CapTP version `1.0`.
          OCAPN_CAPTP_VERSION: '1.0'
          OCAPN_INTEROP_GUILE_MESSAGE: hello from Guile CI
          OCAPN_INTEROP_ENDO_MESSAGE: hello from Endo OCapN
          # Endo only needs an outbound websocket client in this flow, so bind
          # its local netlayer listener to an ephemeral port.
          OCAPN_TEST_PORT: '0'
        run: |
          set +e
          timeout 120s node ./packages/goblin-chat/test/guile-interop/index.js "$STURDYREF" \
            > /tmp/endo-interop.log 2>&1
          ENDO_EXIT=$?
          set -e
          echo "ENDO_EXIT=$ENDO_EXIT" >> "$GITHUB_ENV"
          cat /tmp/endo-interop.log

      - name: Assert interop success
        if: steps.spritely.outputs.available == 'true'
        run: |
          test "${ENDO_EXIT:-1}" -eq 0
          # Verify Guile host started and published a sturdyref.
          grep -q 'sturdyref: ocapn:' /tmp/guile-interop.log
          grep -q 'interop-client: subscription ready' /tmp/guile-interop.log
          grep -q 'interop-client: sent message, ack' /tmp/guile-interop.log
          # The Endo participant logs status via the shared
          # `runChatParticipant` driver in @endo/goblin-chat, which prefixes
          # each line with the participant name (`endo-interop-ocapn`). Use
          # fixed-string matching so the brackets stay literal.
          grep -Fq '*** [endo-interop-ocapn] subscription ready' /tmp/endo-interop.log
          grep -Fq '*** [endo-interop-ocapn] sent message, ack =' /tmp/endo-interop.log
          grep -Fq '*** [endo-interop-ocapn] interop observer received message: hello from Guile CI' /tmp/endo-interop.log
          grep -Fq '*** [endo-interop-ocapn] interop observer received message: hello from Endo OCapN' /tmp/endo-interop.log
          grep -Fq '*** Endo interop completed' /tmp/endo-interop.log

      - name: Show interop logs on failure
        if: failure() && steps.spritely.outputs.available == 'true'
        run: |
          echo "=== Guile goblin-chat host log ==="
          cat /tmp/guile-interop.log || echo "(no log)"
          echo "=== Endo interop client log ==="
          cat /tmp/endo-interop.log || echo "(no log)"

      - name: Stop Guile host (always)
        if: always()
        run: |
          if [ -f /tmp/guile-interop.pid ]; then
            kill $(cat /tmp/guile-interop.pid) || true
          fi
