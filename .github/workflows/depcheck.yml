name: Test project mutual dependency versions

# run CI on pushes to master, and on all PRs (even the ones that target other
# branches)

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

# Cancel in-progress runs for the same branch when a new run is started
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          submodules: 'true'
          persist-credentials: false

      # without this, setup-node errors on mismatched npm versions
      - run: corepack enable

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .node-version
      - name: Install graphviz
        run: sudo apt install -y graphviz

      - name: Check for cycles
        run: scripts/check-dependency-cycles.sh 0

        # npm's workspace graph is checked by npm install and the lockfile.
        # Add a dedicated constraint check here if stricter workspace policies
        # become necessary.
