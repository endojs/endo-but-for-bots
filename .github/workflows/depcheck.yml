name: Test project mutual dependency versions

# run CI on pushes to the repository trunks, and on all PRs (even the ones that
# target other branches)

on:
  push:
    branches: [master, llm]
  pull_request:

permissions:
  contents: read

# Defense in depth against npm lifecycle scripts. This workflow does not run
# a package install, but this block documents the posture and future-proofs
# against additions. See designs/ci-no-npm-lifecycle.md.
env:
  YARN_ENABLE_SCRIPTS: 'false'
  npm_config_ignore_scripts: 'true'

# Cancel in-progress runs for the same branch when a new run is started
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    uses: $/.github/workflows/ci-changes.yml

  build:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || fromJSON(needs.changes.outputs.jobs)['depcheck']) }}
    # Ubuntu 26.04 Graphviz omits tred, which the cycle checker requires.
    runs-on: ubuntu-24.04
    steps:
      - name: Require successful change detection
        if: needs.changes.result != 'success'
        run: exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: 'true'
          persist-credentials: false

      # without this, setup-node errors on mismatched yarn versions
      - run: corepack enable

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      # Ubuntu 26.04 (graphviz 14) moved `tred` and `acyclic` out of the
      # `graphviz` package into `graphviz-tools`; older images ship them in
      # `graphviz` and have no `graphviz-tools`.
      - name: Install graphviz
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          if ! command -v tred >/dev/null || ! command -v acyclic >/dev/null; then
            sudo apt-get install -y graphviz-tools
          fi
          command -v dot tred acyclic

      - name: Check for cycles
        run: scripts/check-dependency-cycles.sh 0

        # Under Yarn "classic" this job also checked for mismatchedWorkspaceDependencies
        # (https://github.com/yarnpkg/yarn/blob/158d96dce95313d9a00218302631cd263877d164/src/cli/commands/workspaces.js#L49)
        # but it's not supported in Berry and it's better solved by the "workspace:*" protocol.
        # If we do want more workspace constraint enforcement, we can define arbitrarily with:
        #    https://yarnpkg.com/features/constraints
