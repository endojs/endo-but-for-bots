name: 9p-sandbox-probe

# EXPERIMENTAL PROBE BRANCH — DO NOT MERGE.
#
# This file deliberately *replaces* the full Endo CI (the other workflow
# files were removed on this branch) with a single matrix job that answers
# one question: does the host-side 9P mount + podman bind — the "plan B"
# workspace projection that @endo/claude-sandbox relies on — actually work
# on GitHub-hosted runners? The matrix probes a few Ubuntu images because
# the variable is the runner kernel: whether it ships CONFIG_9P_FS and lets
# an unprivileged user mount(2) via sudo.
#
# See packages/claude-sandbox/test/ninep-flow.test.js for the probe itself.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Match the upstream CI posture: never let an npm/yarn lifecycle script run
# implicitly at install.
env:
  YARN_ENABLE_SCRIPTS: 'false'
  npm_config_ignore_scripts: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ninep-sandbox-probe:
    name: ninep-sandbox-probe (${{ matrix.runner }})

    runs-on: ${{ matrix.runner }}

    strategy:
      # Report every row independently — the point is the per-runner verdict.
      fail-fast: false
      matrix:
        runner:
          - ubuntu-22.04
          - ubuntu-24.04
          - ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # without this, setup-node errors on mismatched yarn versions
      - run: corepack enable

      - name: Use Node.js 22.x
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 22.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Run yarn build
        run: yarn build

      # Self-documenting matrix row: dump the host's 9P + privilege + podman
      # posture before the test so a green/red result is interpretable from
      # the log alone. `continue-on-error` is not set — these commands are
      # all best-effort (`|| echo ...`) so the step never fails the job.
      - name: Probe host capabilities
        run: |
          set -x
          uname -a
          head -2 /etc/os-release || true
          sudo modprobe 9p 9pnet 9pnet_virtio 2>&1 \
            || echo "modprobe failed (may be built-in, or unprivileged)"
          grep -w 9p /proc/filesystems || echo "9p NOT in /proc/filesystems"
          command -v mount umount podman || true
          podman --version || true
          sudo -n true && echo "passwordless sudo: yes" \
            || echo "passwordless sudo: no"

      # Pre-pull the OCI image the sandbox stage binds the 9P mount into, so
      # a registry flake surfaces as a visible setup failure, not a mid-test
      # timeout. Keep in sync with ALPINE_REF in the probe test.
      - name: Pre-pull alpine OCI image
        run: podman pull docker.io/library/alpine:3.19

      # NINEP_REQUIRE=1 turns "9P/podman unavailable" into a hard failure, so
      # a runner that cannot do the flow shows as a red matrix row rather than
      # a silent green. NINEP_SUDO=1 routes the privileged mount(2)/umount(2)
      # through sudo (GitHub runners grant passwordless sudo).
      - name: Run 9P sandbox flow probe
        env:
          NINEP_REQUIRE: '1'
          NINEP_SUDO: '1'
        run: yarn workspace @endo/claude-sandbox run test:ninep
