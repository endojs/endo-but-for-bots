name: Familiar Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 0.1.0)'
        required: false
        type: string
  push:
    tags:
      - 'familiar-v*'

permissions:
  contents: write

# Defense in depth against npm lifecycle scripts running implicitly at install.
# See designs/ci-no-npm-lifecycle.md.
env:
  YARN_ENABLE_SCRIPTS: 'false'
  npm_config_ignore_scripts: 'true'

jobs:
  build-artifacts:
    name: Build bundles and chat dist
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: 22.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build chat dist
        run: yarn workspace @endo/chat build

      - name: Bundle CLI and gateway
        run: yarn workspace @endo/familiar step:bundle

      - name: Upload chat dist
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chat-dist
          path: packages/chat/dist/

      - name: Upload bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundles
          path: packages/familiar/bundles/

  # macOS arm64 and x64 build on architecture-matched runners (macos-14 is
  # Apple Silicon, macos-13 is the last Intel-runner generation GitHub still
  # offers). This is the lighter-touch of the two G15 options in
  # designs/familiar-release.md: the matrix produces two distinct native
  # artifacts per release and the user picks the one for their hardware,
  # vs. the multi-day universal-binary path that would lipo the two
  # together via @electron/universal. The matrix needs no extra tooling,
  # no signing dance for combining slices, and no fat-binary size cost;
  # the universal binary stays tracked as a post-MVR followup for
  # whenever the single-download UX wins out over the per-target
  # distribution surface.
  make:
    name: Make (${{ matrix.target-os }}-${{ matrix.target-arch }})
    needs: build-artifacts
    runs-on: ${{ matrix.runner }}

    strategy:
      matrix:
        include:
          - runner: macos-14
            target-os: darwin
            target-arch: arm64
          - runner: macos-13
            target-os: darwin
            target-arch: x64
          - runner: ubuntu-latest
            target-os: linux
            target-arch: x64

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - run: corepack enable

      - name: Use Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6
        with:
          node-version: 22.x
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Download chat dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: chat-dist
          path: packages/chat/dist/

      - name: Download bundles
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bundles
          path: packages/familiar/bundles/

      - name: Download Node.js binary
        run: |
          cd packages/familiar
          ./scripts/download-node.sh v20.18.1 ${{ matrix.target-os }} ${{ matrix.target-arch }}

      - name: Prepare package
        run: |
          cd packages/familiar
          ./scripts/prepare-package.sh ${{ matrix.target-os }} ${{ matrix.target-arch }}

      - name: Package app
        run: |
          cd packages/familiar
          node scripts/package-app.mjs ${{ matrix.target-os }} ${{ matrix.target-arch }}

      - name: Make distributables
        run: |
          cd packages/familiar
          node scripts/make-distributables.mjs ${{ matrix.target-os }} ${{ matrix.target-arch }}

      - name: Upload make output
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: familiar-${{ matrix.target-os }}-${{ matrix.target-arch }}
          path: packages/familiar/out/make/

  release:
    name: Create release
    needs: make
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/familiar-v') || github.event.inputs.version != ''

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: artifacts/
          pattern: familiar-*

      - name: Determine version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "tag=familiar-v${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631 # v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Familiar ${{ steps.version.outputs.tag }}
          draft: true
          files: artifacts/**/*
