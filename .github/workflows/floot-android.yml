name: Floot Android

on:
  push:
    branches: [master, llm]
  pull_request:

permissions:
  contents: read

env:
  YARN_ENABLE_SCRIPTS: 'false'
  npm_config_ignore_scripts: 'true'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: 'true'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22.x
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '17'
      - name: Install dependencies
        run: |
          corepack enable
          yarn install --immutable
      - name: Install Android toolchains
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;29.0.14206865'
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14206865" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android
      - name: Test Android shell
        run: yarn workspace @endo/floot-android test:android
      - name: Build Android runtime and APK
        run: yarn workspace @endo/floot-android build:android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: floot-android-results
          path: |
            packages/floot-android/android/app/build/outputs/apk/debug/app-debug.apk
            packages/floot-android/android/app/build/reports/tests/testDebugUnitTest/
          retention-days: 7
