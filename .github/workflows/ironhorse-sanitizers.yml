name: IronHorse oracle sanitizers

on:
  push:
    branches: [master, llm]
  pull_request:
    paths:
      - 'rust/engine/**'
      - 'rust/endo/xsnap/xsnap-platform.*'
      - 'c/moddable'
      - '.gitmodules'
      - 'rust-toolchain.toml'
      - '.github/workflows/ironhorse-sanitizers.yml'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  oracle-sanitizers:
    name: ironhorse-oracle-sanitizers (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # F034 calls for an advisory lane first. The pinned XS interpreter
    # currently fails UBSAN alignment checks; keep the finding visible
    # while the independent, unsanitized parity suite remains blocking.
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch pinned XS oracle
        run: git submodule update --init --depth 1 c/moddable

      - name: Install Clang
        run: |
          sudo apt-get update
          sudo apt-get install -y clang

      - name: Build instrumented oracle test targets
        run: bash rust/engine/scripts/test-oracle-sanitizers.sh --no-run

      - name: Run ASAN and UBSAN over the C oracle
        id: sanitizers
        # Step-level continuation gives the advisory job a successful check
        # while retaining the failure outcome and complete sanitizer log.
        # Checkout, setup, and instrumented compilation remain blocking.
        continue-on-error: true
        run: bash rust/engine/scripts/test-oracle-sanitizers.sh

      - name: Report sanitizer outcome
        if: always()
        env:
          OUTCOME: ${{ steps.sanitizers.outcome }}
        run: |
          echo "Oracle ASAN/UBSAN result: $OUTCOME (advisory during W0 rollout)." >> "$GITHUB_STEP_SUMMARY"
          if [ "$OUTCOME" != success ]; then
            echo '::warning::Oracle sanitizer run did not pass. Inspect the sanitizer diagnostics; no suppression is applied.'
          fi
