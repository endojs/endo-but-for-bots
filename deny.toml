# cargo-deny supply-chain policy (https://embarkstudios.github.io/cargo-deny/),
# written against the cargo-deny 0.21 configuration schema.
#
# One policy for every Cargo root with a committed lockfile. CI runs
# `cargo deny --locked check` once per root, passing this file with
# `--config`:
#
#   Cargo.toml                                 the daemon workspace
#   rust/engine/Cargo.toml                     the Ironhorse engine workspace
#   rust/engine/ironhorse-fuzz/fuzz/Cargo.toml the cargo-fuzz targets
#
# Deliberately NOT checked: the standalone roots under rust/engine that commit
# no lockfile (ironhorse-snapshot/footprint, stack-lanes/probe,
# stack-lanes/memory/probe, wasm-worker-spike, wasm-worker-spike/export-heap).
# Their scripts copy rust/engine/Cargo.lock in before building, and their only
# registry dependencies are those of path crates already in the engine or
# daemon graphs above, so they add no package this policy does not already
# see; `--locked` would also fail on them for want of a lockfile.

[graph]
# Every platform: a licence or advisory on a Windows- or macOS-only
# dependency ships in those builds just the same.
all-features = true

[advisories]
# Vulnerability and unsound advisories are always errors in this schema
# version and cannot be downgraded; listing an advisory ID in `ignore` (with a
# reason) is the only way past one.
#
# Unmaintained advisories are errors only for crates a member depends on
# directly, where replacing the crate is in our hands; for a transitive
# dependency they would fail CI on decisions only an upstream can act on.
unmaintained = "workspace"
yanked = "deny"
ignore = []

[licenses]
# The licences actually in use across the three graphs (from
# `cargo deny list`), each permissive or weak-copyleft-at-file-level. Adding a
# licence here is a policy decision: say why in the commit.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
exceptions = []
# One allow-list serves three graphs, so each root leaves some entries
# unmatched (NCSA is only the fuzz root's libfuzzer-sys, for example).
unused-allowed-license = "allow"

[licenses.private]
# Our own unpublished crates (`publish = false`) carry the repository's
# Apache-2.0 LICENSE rather than a per-crate `license` field.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Path dependencies have no version requirement; that is not a wildcard
# registry dependency. This exemption applies to unpublished crates only.
allow-wildcard-paths = true
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# No git dependencies are in use. Add an exact repository URL here, never an
# organisation, if one becomes necessary.
allow-git = []
