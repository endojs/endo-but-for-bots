<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="780" viewBox="0 0 1120 780" role="img" aria-labelledby="title desc"><title id="title">Self-mail latency: nested wall-time breakdown</title><desc id="desc">12.082 seconds total. Daemon until publication 12.050 seconds, including 7.978 seconds synchronous filesystem work, of which 7.554 seconds were hub state rewrites. Rings encode containment, not chronological order. Worker CPU timings overlap and are excluded.</desc><rect width="1120" height="780" fill="#f8fafc"/><g font-family="system-ui, sans-serif">
<text x="45" y="55" font-size="30" fill="#253449" font-weight="650">Where the self-mail latency went</text>
<text x="45" y="86" font-size="16" fill="#607086" font-weight="400">One browser subscriber · measured local Notes loopback · 18 October 2026</text>
<path d="M 330.000,242.000 A 143,143 0 1 1 327.620,242.020 L 328.519,296.012 A 89,89 0 1 0 330.000,296.000 Z" fill="#64748b" stroke="#fff" stroke-width="1"><title>Daemon until state publication: 12,050.00 ms (99.74%)</title></path>
<path d="M 327.620,242.020 A 143,143 0 0 1 327.695,242.019 L 328.565,296.012 A 89,89 0 0 0 328.519,296.012 Z" fill="#eab308" stroke="#fff" stroke-width="1"><title>State transport: 1.00 ms (0.01%)</title></path>
<path d="M 327.695,242.019 A 143,143 0 0 1 330.000,242.000 L 330.000,296.000 A 89,89 0 0 0 328.565,296.012 Z" fill="#14b8a6" stroke="#fff" stroke-width="1"><title>Browser state to observed DOM: 31.00 ms (0.26%)</title></path>
<path d="M 330.000,184.000 A 201,201 0 1 1 160.084,492.376 L 206.579,462.995 A 146,146 0 1 0 330.000,239.000 Z" fill="#3b82f6" stroke="#fff" stroke-width="1"><title>Synchronous filesystem work: 7,977.80 ms (66.03%)</title></path>
<path d="M 160.084,492.376 A 201,201 0 0 1 326.655,184.028 L 327.570,239.020 A 146,146 0 0 0 206.579,462.995 Z" fill="#cbd5e1" stroke="#fff" stroke-width="1"><title>Other daemon wall time, unpartitioned: 4,072.20 ms (33.70%)</title></path>
<path d="M 330.000,126.000 A 259,259 0 1 1 146.621,567.902 L 185.563,529.062 A 204,204 0 1 0 330.000,181.000 Z" fill="#1d4ed8" stroke="#fff" stroke-width="1"><title>793 hub.json rewrites: 7,553.75 ms (62.52%)</title></path>
<path d="M 146.621,567.902 A 259,259 0 0 1 111.054,523.360 L 157.548,493.979 A 204,204 0 0 0 185.563,529.062 Z" fill="#93c5fd" stroke="#fff" stroke-width="1"><title>Other synchronous filesystem work: 424.05 ms (3.51%)</title></path>
