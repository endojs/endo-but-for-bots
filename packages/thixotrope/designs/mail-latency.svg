<text x="45" y="701" font-size="15" fill="#475569" font-weight="400">Rings show containment, not event order. Percentages use total elapsed wall time.</text>
<text x="45" y="728" font-size="15" fill="#475569" font-weight="400">Other daemon time includes work and waiting; it is not a measurement of CPU time.</text>
<text x="45" y="755" font-size="15" fill="#475569" font-weight="400">Worker compile / execution / GC overlap with these categories and are deliberately excluded.</text>
