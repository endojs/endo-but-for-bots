<text x="665" y="286" font-size="16" fill="#253449" font-weight="550">↳ Synchronous filesystem</text>
<text x="665" y="307" font-size="15" fill="#607086" font-weight="400">7.978 s · 66.0%</text>
<rect x="640" y="328" width="12" height="12" rx="3" fill="#1d4ed8"/>
<text x="665" y="341" font-size="16" fill="#253449" font-weight="550">    ↳ hub.json rewrites × 793</text>
<text x="665" y="362" font-size="15" fill="#607086" font-weight="400">7.554 s · 62.5%</text>
