<text x="665" y="417" font-size="15" fill="#607086" font-weight="400">0.424 s · 3.5%</text>
<rect x="640" y="438" width="12" height="12" rx="3" fill="#cbd5e1"/>
<text x="665" y="451" font-size="16" fill="#253449" font-weight="550">↳ Other daemon time</text>
<text x="665" y="472" font-size="15" fill="#607086" font-weight="400">4.072 s · 33.7%</text>
