<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>App · Agent C</title>
<!-- kit.css = the shared theme vars + kit-* component classes (snapshot of index.html's style block),
     so a standalone app renders identically without pulling in the whole chat shell. -->
<link rel="stylesheet" href="/kit.css">
<style>
  /* Standalone-app layout. Override any chat-shell body rules kit.css carries over. */
  html, body { margin: 0; }
  body { display: block !important; height: auto !important; overflow: auto !important; }
  .apps-wrap { max-width: 820px; margin: 0 auto; padding: 16px 14px 64px; }
  .apps-head { display: flex; align-items: center; gap: 10px; margin-bottom: 4px; }
  .apps-head h1 { font-size: 17px; margin: 0; }
  .apps-sub { color: var(--mut); font-size: 12px; margin: 0 0 14px; }
  #app { min-height: 80px; }
</style>
</head>
<body>
  <div class="apps-wrap">
    <div class="apps-head"><span style="color:var(--acc)">🧩</span><h1 id="apptitle">App</h1><span style="flex:1"></span><button id="apps-minimize" style="font:inherit;font-size:12px;cursor:pointer;background:var(--panel,#11141f);border:1px solid var(--edge,#262c3d);color:var(--ink,#e6edf3);border-radius:7px;padding:4px 9px">⊟ Minimize to chat</button></div>
    <div class="apps-sub" id="appsub">A standalone app served from this origin — no separate service.</div>
    <div id="app">loading…</div>
  </div>
  <!-- islands bundle first (sets globalThis.__fieldIslands), then the per-app host controller -->
  <script src="/islands/islands.js" type="module"></script>
  <script src="/apps-host.js" type="module"></script>
</body>
</html>
