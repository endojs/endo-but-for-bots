<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Trace</title>
<!--
  Standalone 3D conversation-trace app. It is STATELESS: it receives a `chat`
  capability over a postMessage MessagePort (the port IS the capability) and is a pure
  function of that object — it calls chat.getTrace()/getInfo()/selectVersion() and renders.
  It has NO access to the parent beyond the methods on the passed cap. A dev agent can
  edit THIS file (trace-app.js) to change how traces look; reloading the iframe applies it.
-->
<style>
  html, body { margin:0; height:100%; background:#0a0f1e; overflow:hidden; }
  #c { width:100vw; height:100vh; display:block; touch-action:none; }
  .bar { position:absolute; top:0; left:0; right:0; display:flex; gap:8px; align-items:center; padding:8px 12px; color:#8b949e; font:12px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; background:linear-gradient(#0a0f1eee,transparent); flex-wrap:wrap; }
  .bar button { background:transparent; border:1px solid #30363d; color:#8b949e; border-radius:7px; padding:3px 9px; cursor:pointer; font-size:12px; }
  .bar button:disabled { opacity:.35; cursor:default; }
  .bar b { color:#e6edf3; }
  #note { flex-basis:100%; font-size:11px; margin-top:4px; }
  #err { position:absolute; top:40%; left:0; right:0; text-align:center; color:#f85149; font:13px sans-serif; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="bar">
  <span id="title">⊿ trace</span>
  <span id="vers"></span>
  <span style="flex:1"></span>
  <span id="status">connecting…</span>
  <span id="note"></span>
</div>
<div id="err" class="hide"></div>
<script type="module" src="/trace-app.js"></script>
</body>
</html>
