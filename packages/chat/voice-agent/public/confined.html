<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!-- The hard boundary: this document runs at a UNIQUE OPAQUE ORIGIN (the iframe is sandbox="allow-scripts"
     with NO allow-same-origin), so it cannot touch the parent DOM, parent cookies/localStorage, or the cap.
     This CSP additionally blocks ALL network — the agent's code can render + postMessage to the parent and
     nothing else (no fetch, no img/script exfil). The parent holds the cap and brokers live data IN. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:">
<style>
  html,body { margin:0; padding:0; background:transparent; color:#e6edf3; font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  body { padding:2px; }
  * { box-sizing:border-box; }
  .cu-err { color:#ff9e9e; font-size:12px; padding:8px; border:1px solid #5a2b2b; border-radius:8px; background:#2a1414; }
  /* ui.island — the curated in-frame kit (themed via the CSS vars the parent pushes in; falls back if absent) */
  .cu-card { border:1px solid var(--edge,#30363d); border-radius:10px; padding:10px 12px; background:var(--panel,#161b22); margin:4px 0; }
  .cu-title { font-weight:600; margin-bottom:6px; }
  .cu-btn { cursor:pointer; display:inline-flex; align-items:center; justify-content:center; min-height:34px; padding:6px 12px; border:1px solid var(--edge,#30363d); border-radius:7px; background:transparent; color:var(--mut,#8b949e); font:inherit; font-size:13px; transition:background .12s,border-color .12s,color .12s; }
  .cu-btn:hover { color:var(--ink,#e6edf3); border-color:var(--acc,#7c5cff); } /* hover feedback */
  .cu-btn:focus-visible, .cu-in:focus-visible { outline:2px solid var(--acc,#7c5cff); outline-offset:2px; } /* keyboard focus ring (was UA-default only) */
  .cu-btn.primary { background:var(--acc-fill,#6b3fd6); border-color:var(--acc-fill,#6b3fd6); color:#fff; font-weight:600; }
  .cu-btn.danger { color:var(--bad,#f85149); border-color:var(--bad,#f85149); font-weight:600; background:rgba(248,81,73,.1); } /* destructive reads distinct from a benign peer without relying on hue alone */
  .cu-chip { display:inline-block; font-size:11px; padding:2px 8px; border-radius:999px; background:rgba(127,127,127,.2); color:var(--ink,#e6edf3); } /* --ink text so the chip clears AA in both themes (was muted-on-grey = 4.45 in light) */
  .cu-badge { display:inline-block; font-size:10px; font-weight:600; padding:1px 6px; border-radius:9px; background:var(--acc-fill,#6b3fd6); color:#fff; }
  .cu-banner { padding:8px 10px; border-radius:8px; border:1px solid var(--edge,#30363d); font-size:13px; margin:4px 0; }
  .cu-banner.warn { border-color:var(--warn,#d29922); } .cu-banner.error { border-color:var(--bad,#f85149); } .cu-banner.ok { border-color:var(--acc2,#2ea043); } /* warn now themes like its siblings (was dark-only #7a5a1a) */
  .cu-meta { font-size:12px; color:var(--mut,#8b949e); }
  .cu-stack { display:flex; flex-direction:column; gap:8px; } .cu-row { display:flex; gap:8px; align-items:center; flex-wrap:wrap; }
  .cu-divider { border:none; border-top:1px solid var(--edge,#30363d); margin:6px 0; }
  .cu-empty { text-align:center; color:var(--mut,#8b949e); font-size:13px; padding:14px; }
  .cu-prog { height:6px; background:var(--edge,#30363d); border-radius:6px; overflow:hidden; } .cu-prog > span { display:block; height:100%; background:var(--acc-fill,#6b3fd6); }
  .cu-field { display:flex; flex-direction:column; gap:4px; } .cu-label { font-size:12px; color:var(--mut,#8b949e); }
  .cu-in { width:100%; box-sizing:border-box; background:var(--bg,#0d1117); border:1px solid var(--edge,#30363d); color:var(--ink,#e6edf3); border-radius:8px; padding:8px 10px; font:inherit; }
</style>
</head>
<body>
<script>
'use strict';
// ── confinable UI runtime (after danfinlay/confinable-ui) ──────────────────────────────────────────
// The agent's component is a function (ui) => element. `ui` hands it create()/grain()/local() — never the
// DOM, never the network. A GRAIN is { get, set, subscribe }; an element .follow(grain) subscribes + paints
// on every push (no polling). Live grains are fed by the PARENT over postMessage (it holds the cap).

const grain = (initial) => {
  let value = initial; const subs = new Set();
  return {
    get: () => value,
    set: (v) => { value = v; for (const fn of [...subs]) { try { fn(v); } catch (e) {} } },
    subscribe: (fn) => { subs.add(fn); if (value !== undefined) { try { fn(value); } catch (e) {} } return () => subs.delete(fn); },
  };
};

// element factory — a whitelisted, chainable wrapper. Defense-in-depth (the sandbox is the real boundary).
const TAGS = new Set(['div','span','p','a','b','i','em','strong','small','h1','h2','h3','h4','ul','ol','li','img','button','input','label','br','hr','code','pre','table','thead','tbody','tr','td','th','section','header','footer','progress','meter']);
const ATTRS = new Set(['class','id','type','placeholder','value','alt','width','height','title','min','max','step','for','colspan','rowspan']);
const STYLE_OK = /^[a-zA-Z-]+$/;
const safeUrl = (u) => { u = String(u || ''); return /^(https?:\/\/|#|data:image\/)/.test(u) ? u : '#'; };
// ── render-guard (mirror of render-guard.mjs — KEEP IN LOCKSTEP) ───────────────────────────────
// A JS object/promise dropped into a TEXT slot coerces via String() to "[object Xxx]" — the smell
// the user sees instead of their data. slotText() renders a READABLE fallback instead AND records
// the smell so mount() can report it to the host → owner feedback-loops + the agent's re-author loop.
const SMELL_RE = /\[object [A-Za-z][\w$]*\]/;
let __smells = [];
const coercesToSmell = (v) => { try { return SMELL_RE.test(String(v)); } catch (e) { return false; } };
const safeText = (v) => {
  if (v == null) return '';
  const t = typeof v;
  if (t === 'string') return v;
  if (t === 'number' || t === 'boolean' || t === 'bigint') return String(v);
  if (t === 'symbol') return v.toString();
  if (t === 'function') return '';
  if (v && typeof v.then === 'function') return '⟨pending…⟩';
  let out; try { out = JSON.stringify(v); } catch (e) { out = ''; }
  if (!out || out === '{}' || out === '[]') { const n = (v.constructor && v.constructor.name) || 'object'; out = '⟨' + n + '⟩'; }
  return out.length > 400 ? out.slice(0, 399) + '…' : out;
};
const slotText = (v, where) => { if (coercesToSmell(v)) __smells.push({ tag: (String(v).match(SMELL_RE) || ['[object Object]'])[0], where: where || '', preview: safeText(v).slice(0, 120) }); return safeText(v); };
let report = () => {};

const create = (tag) => {
  const t = String(tag || 'div').toLowerCase();
  const el = document.createElement(TAGS.has(t) ? t : 'div');
  const w = {
    el,
    text: (s, where) => { el.textContent = slotText(s, where); return w; },
    attr: (k, v) => { k = String(k); if (ATTRS.has(k)) el.setAttribute(k, String(v)); else if (k === 'href') el.setAttribute('href', safeUrl(v)); else if (k === 'src') el.setAttribute('src', safeUrl(v)); else if (/^(data|aria)-/.test(k)) el.setAttribute(k, String(v)); return w; },
    class: (c) => { el.className = String(c || ''); return w; },
    style: (obj) => { if (obj && typeof obj === 'object') for (const k in obj) { if (STYLE_OK.test(k)) try { el.style[k] = String(obj[k]); } catch (e) {} } return w; },
    on: (event, fn) => { const ev = String(event); if (['click','input','change','keydown'].includes(ev) && typeof fn === 'function') el.addEventListener(ev, (e) => { try { fn({ value: el.value, key: e.key, preventDefault: () => e.preventDefault() }); report(); } catch (err) {} }); return w; },
    push: (childOrChildren) => { const arr = Array.isArray(childOrChildren) ? childOrChildren : [childOrChildren]; for (const c of arr) { if (!c) continue; const node = c && c.el ? c.el : (typeof c === 'string' ? document.createTextNode(c) : null); if (node) el.appendChild(node); } return w; },
    // FOLLOW a grain: paint render(value) now + on every push. The "lazily written component" seam.
    follow: (g, render) => { if (g && typeof g.subscribe === 'function') g.subscribe((v) => { try { el.textContent = slotText(render ? render(v) : v, 'live-cell'); report(); } catch (e) {} }); return w; },
    // follow but the render fn returns a {style}/text patch instead of just text (for richer live UI)
    followWith: (g, fn) => { if (g && typeof g.subscribe === 'function') g.subscribe((v) => { try { fn(v, w); report(); } catch (e) {} }); return w; },
  };
  return w;
};

// All parent↔iframe traffic after mount goes over a private MessagePort the parent transfers on mount
// (scoped, no shared window listener). `send` uses the port once it exists; 'ready' is the only pre-port msg.
let CU_PORT = null;
const send = (m) => { try { const msg = { __cu: 1, ...m }; if (CU_PORT) CU_PORT.postMessage(msg); else parent.postMessage(msg, '*'); } catch (e) {} }; // __cu tag on BOTH paths (the port path dropped it before)

// ── the live-grain bridge: ui.grain(cellId) is a server cell the PARENT feeds us; ui.local(v) is client state. ──
const cellGrains = new Map();
const requestedCells = new Set();
const apiGrain = (cellId) => {
  const id = String(cellId || '');
  if (!cellGrains.has(id)) {
    const g = grain(undefined);
    // PROPAGATOR (not a redux action): a cell is shared STATE. .set(v) writes the value, which propagates UP to
    // the parent's cell of the same id; the parent re-propagates it (e.g. the `theme` cell → the whole app).
    // The parent only honours a write on a cell it GRANTED writable (designation by the held cell, validated there).
    const baseSet = g.set;
    let last;
    g.assign = (v) => { baseSet(v); }; // INBOUND propagation (a value DELIVERED from the parent) — settle locally, never re-emit
    g.set = (v) => { const s = JSON.stringify(v); if (s === last) return; last = s; baseSet(v); send({ type: 'cell-set', cell: id, value: v }); }; // OUTBOUND write — idempotent: re-setting the same value is a no-op (no message storm)
    cellGrains.set(id, g);
    if (!requestedCells.has(id)) { requestedCells.add(id); send({ type: 'subscribe', cell: id }); } // once per cell — the parent also dedups
  }
  return cellGrains.get(id);
};

// ── ui.island(name, props, children): a CURATED, PURE subset of the design-system kit, expressed ENTIRELY
//    over create() (no island bundle, no import, no new authority — the CSP/sandbox boundary is untouched) so
//    a reply widget can wear the app's look + behaviour. Unknown name → a labelled fallback (never throws).
//    Props are render-safe DATA only; these builders grant nothing create() doesn't already.
// content-bearing primitives read a NAMED prop (label/text/parts) for their content — BUT also fall back to
// any CHILDREN passed (a very common authoring mistake: `island('Badge', {}, [span(time)])` instead of
// `island('Badge', {label: time})`). `txt` resolves the named value; if absent, the kids render — so neither
// shape silently drops the content (the "times never show up" bug).
const labelOrKids = (el, val, kids, where) => (val != null ? el.text(val, where) : (kids ? el.push(kids) : el));
const KIT = {
  Card: (p, kids) => create('div').class('cu-card').push(p.title != null ? create('div').class('cu-title').text(p.title, 'Card.title') : null).push(p.body != null ? create('div').text(p.body, 'Card.body') : null).push(kids),
  Btn: (p, kids) => { const b = create('button').class('cu-btn' + (p.variant === 'primary' ? ' primary' : p.variant === 'danger' ? ' danger' : '')); labelOrKids(b, p.label, kids, 'Btn.label'); if (typeof p.onClick === 'function') b.on('click', () => p.onClick()); return b; },
  Chip: (p, kids) => labelOrKids(create('span').class('cu-chip'), p.label, kids, 'Chip.label'),
  Badge: (p, kids) => labelOrKids(create('span').class('cu-badge'), p.label, kids, 'Badge.label'),
  Banner: (p, kids) => { const d = create('div').class('cu-banner ' + (['warn', 'error', 'ok'].includes(p.kind) ? p.kind : 'info')); if (p.icon) d.push(create('span').text(safeText(p.icon) + ' ')); return labelOrKids(d, p.text, kids, 'Banner.text'); },
  Meta: (p, kids) => { const d = create('div').class('cu-meta'); if (Array.isArray(p.parts)) return d.text(p.parts.map(x => slotText(x, 'Meta.parts')).join(' · ')); return labelOrKids(d, p.text, kids, 'Meta.text'); },
  Divider: () => create('hr').class('cu-divider'),
  Stack: (p, kids) => create('div').class('cu-stack').push(kids),
  Row: (p, kids) => create('div').class('cu-row').push(kids),
  EmptyState: (p, kids) => labelOrKids(create('div').class('cu-empty'), p.text != null ? p.text : (kids ? null : 'nothing here'), kids),
  ProgressBar: (p) => { const pct = Math.max(0, Math.min(100, Number(p.value) || 0)); return create('div').class('cu-prog').push(create('span').style({ width: pct + '%' })); },
  Field: (p, kids) => create('label').class('cu-field').push(p.label != null ? create('span').class('cu-label').text(p.label, 'Field.label') : null).push(kids),
  TextField: (p) => { const i = create('input').class('cu-in').attr('type', p.type || 'text').attr('placeholder', p.placeholder || ''); if (p.value != null) i.attr('value', slotText(p.value, 'TextField.value')); if (typeof p.onInput === 'function') i.on('input', e => p.onInput(e.value)); return i; },
};
const island = (name, props, kids) => {
  const f = KIT[String(name)]; const p = (props && typeof props === 'object' && !Array.isArray(props)) ? props : {};
  const k = kids == null ? [] : (Array.isArray(kids) ? kids : [kids]);
  if (typeof f !== 'function') return create('span').class('cu-chip').text('[unknown component: ' + name + ']');
  try { return f(p, k); } catch (e) { return create('div').class('cu-err').text('⚠️ ' + name + ': ' + (e && e.message)); }
};
// ── ui.use(alias): render a PRIOR broken-out component the agent referenced. The parent resolved the agent's
//    alias → that component's (render-safe, scrubbed) source SERVER-SIDE and shipped it in `refs` on mount; the
//    frame only ever sees an agent-chosen alias + source text — never a raw uicomp id, never a cap. The ref runs
//    in THIS same sandbox (no new authority); its declared cells were re-gated under the running cap server-side.
//    One level deep: a ref's own ui.use(other) only resolves top-level aliases (not injected → labelled fallback).
const __cuRefs = {};
const use = (alias) => {
  const fn = __cuRefs[String(alias)];
  if (typeof fn !== 'function') return create('span').class('cu-chip').text('[unavailable: ' + alias + ']');
  try { const r = fn(UI); return (r && r.el) ? r : create('div').text('[empty: ' + alias + ']'); } catch (e) { return create('div').class('cu-err').text('⚠️ ' + alias + ': ' + (e && e.message)); }
};
// ui.grain(id) is the cell seam (above): a granted WRITABLE cell (e.g. 'theme') is read by .subscribe and
// driven by .set(value) — state that propagates, never a command. (No imperative effect/RPC channel.)
const UI = { create, grain: apiGrain, local: grain, h: create, island, use, kit: Object.keys(KIT) };

const fail = (msg) => { try { send({ type: 'error', error: String(msg) }); } catch (e) {} const d = document.createElement('div'); d.className = 'cu-err'; d.textContent = '⚠️ ' + msg; document.body.innerHTML = ''; document.body.appendChild(d); report(); }; // also REPORT the render failure to the host → auto-fix loop

window.addEventListener('error', (e) => { /* swallow source parse/runtime errors so they don't escape; mount reports legibly */ try { e.preventDefault(); } catch (_) {} });
// After a render settles, report any coercion smells to the host (feedback-loops + agent re-author).
// Belt-and-suspenders: also scan the produced DOM text for a smell the kit sinks didn't originate
// (e.g. an agent that String()-concatenated an object itself, or a raw-tag textContent write).
const reportSmells = () => {
  try {
    const seen = new Set(__smells.map(s => s.tag + '|' + s.where));
    const dom = String((document.body && document.body.textContent) || '');
    const re = new RegExp(SMELL_RE.source, 'g'); let m;
    while ((m = re.exec(dom))) { const k = m[0] + '|dom'; if (!seen.has(k)) { seen.add(k); __smells.push({ tag: m[0], where: 'dom', preview: dom.slice(Math.max(0, m.index - 30), m.index + 30) }); } }
    if (__smells.length) send({ type: 'render-smell', smells: __smells.slice(0, 20) });
  } catch (e) {}
};
const mount = (source, refs) => {
  document.body.innerHTML = '';
  __smells = [];
  // Inject each REFERENCED component's source (agent-declared aliases the parent resolved server-side) as a
  // function ui.use(alias) calls — same inline-script seam + same sandbox as the primary source (no new authority).
  if (refs && typeof refs === 'object') { for (const alias in refs) { try { const rs = String((refs[alias] && refs[alias].source) || ''); if (!rs) continue; const rsc = document.createElement('script'); rsc.textContent = 'window.__cu_ref_tmp = (' + rs + ');'; document.head.appendChild(rsc); rsc.remove(); if (typeof window.__cu_ref_tmp === 'function') __cuRefs[String(alias)] = window.__cu_ref_tmp; window.__cu_ref_tmp = null; } catch (e) {} } }
  // Execute the agent source by INJECTING it as an inline <script> (allowed by CSP script-src 'unsafe-inline')
  // rather than eval() (which would need 'unsafe-eval'). Keeps the CSP tight. The sandboxed null-origin +
  // no-network frame is the real boundary; this just satisfies CSP cleanly.
  window.__cu_component = null;
  try { const s = document.createElement('script'); s.textContent = 'window.__cu_component = (' + String(source) + ');'; document.head.appendChild(s); s.remove(); } catch (e) {}
  const fn = window.__cu_component; window.__cu_component = null;
  if (typeof fn !== 'function') return fail('component source must be a function (ui) => element (or it failed to parse)');
  let rootEl;
  try { rootEl = fn(UI); } catch (e) { return fail('component threw while building: ' + e.message); }
  const node = rootEl && rootEl.el ? rootEl.el : (rootEl instanceof Node ? rootEl : null);
  if (!node) return fail('component must return ui.create(...) (an element)');
  document.body.appendChild(node);
  report();
  reportSmells();
};

// report content height — DEBOUNCED + only when it actually changed (a rapidly-pushing cell can't flood the parent).
let reportPending = false, lastH = -1;
report = () => { if (reportPending) return; reportPending = true; setTimeout(() => { reportPending = false; const px = Math.min(2000, Math.max(40, document.body.scrollHeight + 6)); if (px !== lastH) { lastH = px; send({ type: 'height', px }); } }, 50); };

// the global THEME propagates IN as plain CSS-variable data (never a cap) → confined widgets match the user's style.
const applyTheme = (vars) => { if (!vars) return; try { const r = document.documentElement; for (const k in vars) r.style.setProperty(k, vars[k]); document.body.style.background = vars['--bg'] || ''; document.body.style.color = vars['--ink'] || ''; } catch (e) {} };
// The parent transfers a private MessagePort on 'mount'; after that, all traffic is over that port.
window.addEventListener('message', (e) => {
  if (e.source !== parent) return; // only the parent's mount handshake comes over the window
  const m = e.data; if (!m || m.__cu !== 1 || m.type !== 'mount') return;
  const port = e.ports && e.ports[0];
  if (port) { CU_PORT = port; port.onmessage = (pe) => { const pm = pe.data; if (!pm || pm.__cu !== 1) return; if (pm.type === 'cell') { const g = cellGrains.get(String(pm.id)); if (g) (g.assign || g.set)(pm.value); } else if (pm.type === 'theme') applyTheme(pm.vars); }; try { port.start(); } catch (e2) {} }
  if (m.theme) applyTheme(m.theme);
  mount(m.source, m.refs);
});
try { parent.postMessage({ __cu: 1, type: 'ready' }, '*'); } catch (e) {}
</script>
</body>
</html>
