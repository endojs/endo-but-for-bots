<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Dietician console</title>
<style>
  :root { --bg:#0e1116; --panel:#171c24; --panel2:#1e2530; --ink:#e8edf3; --muted:#9aa7b6;
    --green:#2ecc71; --yellow:#f5c451; --line:#2a323d; --accent:#6db3ff; --bad:#ff9e9e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }
  header { padding:20px 18px 14px; background:linear-gradient(160deg,#1b2330,#10141b); border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:1.3rem; } #sub { color:var(--muted); font-size:.85rem; margin-top:3px; }
  main { max-width:760px; margin:0 auto; padding:18px 16px 60px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:14px 16px; margin:12px 0; }
  .card h2 { margin:0 0 10px; font-size:1rem; }
  .row { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin:6px 0; }
  button, select, input { font:inherit; }
  button { background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:999px; padding:7px 13px; cursor:pointer; }
  button:hover { background:#283040; } button.go { background:var(--accent); color:#0e1116; border-color:var(--accent); font-weight:600; }
  button.bad { color:var(--bad); border-color:rgba(255,158,158,.4); }
  select, input { background:var(--panel2); color:var(--ink); border:1px solid var(--line); border-radius:8px; padding:7px 10px; }
  input { min-width:160px; }
  .muted { color:var(--muted); } .counts { display:flex; gap:14px; flex-wrap:wrap; font-size:.9rem; }
  .pill { padding:2px 10px; border-radius:999px; background:var(--panel2); }
  .g { color:var(--green); } .y { color:var(--yellow); }
  pre { background:#010409; border:1px solid var(--line); border-radius:8px; padding:10px; overflow:auto; font:12px ui-monospace,Menlo,monospace; color:#c9d1d9; max-height:280px; }
  .share-row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:7px 0; border-top:1px solid var(--line); }
  iframe { width:100%; height:70vh; border:1px solid var(--line); border-radius:10px; background:#fff; }
  .ok { color:var(--green); } .err { color:var(--bad); }
</style>
</head>
<body>
<header>
  <h1>🍽️ Dietician</h1>
  <div id="sub" class="muted">opening your link…</div>
</header>
<main id="app"><div class="muted">opening your link…</div></main>
<script src="app.js" defer></script>
</body>
</html>
