packages:
  - packages/*

catalogs:
  dev:
    '@fast-check/ava': ^3.0.1
    ava: ^8.0.1
    c8: ^11.0.0
    eslint: ^10.4.1
    eslint-config-prettier: ^10.0.0
    eslint-plugin-eslint-comments: ^3.2.0
    eslint-plugin-import: 'npm:eslint-plugin-import-x@4.16.2'
    tsd: ^0.33.0
    typescript: ~6.0.3

allowBuilds:
  '@lavamoat/preinstall-always-fail': false
  core-js: false
  unrs-resolver: false

overrides:
  '@babel/generator': '7.28.3'
  '@babel/parser': '7.28.3'
  '@babel/traverse': '7.28.3'
  '@endo/eslint-plugin>eslint-plugin-import': 'npm:eslint-plugin-import-x@4.16.2'
  '@endo/eslint-plugin>typescript': '~6.0.3'
  fast-check: '4.8.0'
  rollup: '4.45.1'
