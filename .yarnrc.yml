catalogs:
  dev:
    "@fast-check/ava": ^3.0.1
    ava: ^8.0.1
    c8: ^11.0.0
    eslint: ^8.57.1
    eslint-config-airbnb-base: ^15.0.0
    eslint-config-prettier: ^9.1.2
    eslint-plugin-eslint-comments: ^3.2.0
    # Aliased to eslint-plugin-import-x so that the package on disk is
    # named `eslint-plugin-import` (and ESLint registers it under the
    # `import/*` namespace), while the implementation is the
    # actively-maintained import-x soft fork. The pinned-exact version
    # tracks security advisories on import-x.
    eslint-plugin-import: 'npm:eslint-plugin-import-x@4.16.2'
    tsd: ^0.33.0
    typescript: ~6.0.3
    # @typescript/native-preview is the nightly preview of TypeScript 7
    # (the Go-native rewrite). Deliberately unpinned: nightlies may advance
    # on installs and Renovate bumps. If a new nightly surfaces errors,
    # prefer fixing the code; for an upstream regression, hold back with a
    # yarn `resolutions` entry. See AGENTS.md "TypeScript Preview (tsgo)".
    "@typescript/native-preview": ^7.0.0-dev.0

enableScripts: false

nodeLinker: pnpm
