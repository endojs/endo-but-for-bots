[package]
name = "ih-memory-probe"
version = "0.0.0"
edition = "2021"
publish = false

# A standalone root outside the rust/engine workspace, for the same reason as
# the stack probe (`../../probe/Cargo.toml`): the wasm build uses the unstable
# panic=unwind workaround of WASM-BLOCKERS.md B1, which the workspace's
# --locked builds must not inherit. `memory.py` copies the workspace
# Cargo.lock here before building.
[workspace]

[dependencies]
ironhorse-vm = { path = "../../../ironhorse-vm", features = ["consensus"] }
ironhorse-compile = { path = "../../../ironhorse-compile" }
ironhorse-runtime = { path = "../../../ironhorse-runtime" }
ironhorse-snapshot = { path = "../../../ironhorse-snapshot" }

# Match the workspace: guest-influenced arithmetic must not silently wrap.
[profile.release]
overflow-checks = true
