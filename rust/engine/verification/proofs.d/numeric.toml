[[guarantee]]
id = "NUM-2"
title = "Int32 bitwise and shift operators and Math.clz32"
claim = "For every a, b: i32 and each of & | ^ << >> >>>, interp::numeric::int32_bitop(op, a, b) holds the Number the ironhorse-spec model of the clause gives (shift count ToUint32(b) mod 32; bits as floor(v / 2^k) mod 2), as Integer exactly when that value is an int32 (so >>> yields Integer(u) iff u <= i32::MAX and Number(u) otherwise, and every other operator yields Integer); math_clz32(n) equals its model for every n: u32. Interp::binary_bit and the Math.clz32 native call these helpers. Math.imul (math_imul) is tested against its model, not proved: the 32-bit multiplier equivalence timed out at 600 s."
spec = "ECMA-262 §6.1.6.1.9 Number::leftShift, §6.1.6.1.10 signedRightShift, §6.1.6.1.11 unsignedRightShift, §6.1.6.1.16-§6.1.6.1.19 NumberBitwiseOp / bitwiseAND / XOR / OR, §21.3.2.11 Math.clz32 (quoted in ironhorse-spec/src/int32.rs)"
