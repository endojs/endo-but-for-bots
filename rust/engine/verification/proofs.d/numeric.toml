# Numeric kernels (NUM): designs/ironhorse-formal-verification.md, "Numeric
# kernels". Merged into proofs.toml by verify.py. Budgets are 3x the solver
# time measured on the development host (4 shared cores), at least 5 s;
# memory budgets are the measured peak rounded up. Generated by hand-kept
# tables; keep entries grouped by guarantee.

[[guarantee]]
id = "NUM-1"
title = "ToInt32 … ToUint8 and ToUint8Clamp for every Number"
claim = "For every u64 bit pattern b, numeric_kernel::number_to_u64_wrapping(b) = truncate(ℝ(b)) mod 2^64 (0 for NaN, ±∞, ±0), and to_int32, to_uint32, to_int16, to_uint16, to_int8, to_uint8 and to_uint8_clamp each equal the ironhorse-spec model of their clause. Integer-only kernels, default checks. value::to_int32, interp::numeric::number_to_u64_wrapping, encode_element_le, String.prototype.split's limit, ArraySetLength and String.fromCharCode all call these kernels."
spec = "ECMA-262 §7.1.6 ToInt32, §7.1.7 ToUint32, §7.1.8 ToInt16, §7.1.9 ToUint16, §7.1.10 ToInt8, §7.1.11 ToUint8, §7.1.12 ToUint8Clamp (steps quoted in ironhorse-spec/src/to_integer.rs)"
trusted = ["Kani 0.68 / CBMC 6.11", "the ironhorse-spec models", "the harnesses"]

[[harness]]
guarantee = "NUM-1"
crate = "ironhorse-vm"
name = "numeric_kernel::proofs::num1_number_to_u64_wrapping_matches_spec"
tier = "pr"
statement = "number_to_u64_wrapping(b) == ironhorse_spec::truncate_to_integer_mod_2n(b, 64)."
domain = "every b: u64 (all 2^64 binary64 bit patterns, every NaN payload)"
unwind = 0
flags = []
time_budget_s = 7
memory_budget_gb = 1
unreachable = 0
mutants = ["NUM-1-b", "NUM-1-c"]
expect = "pass"
canary = false

