[[guarantee]]
id = "NUM-6"
title = "Relative-index clamping"
claim = "For every Number n that is integral or ±∞ (the range of ToIntegerOrInfinity) and every len < 2^53, numeric_kernel::relative_index(n, len) equals the spec clamp computed in i128 (0 if n = -∞; max(len + n, 0) if n < 0; min(n, len) otherwise); for every f64 n (NaN and fractions included) the result is in 0..=len. It is the one clamp behind Array.prototype splice, copyWithin, fill, toSpliced and the generic slice, the %TypedArray% relative indices, String.prototype.slice's string_arg_to_index and Interp::arg_to_index."
spec = "ECMA-262 §23.1.3.28 Array.prototype.slice steps 3-6 (quoted in ironhorse-spec/src/relative_index.rs); the same steps in §23.1.3.4 copyWithin, §23.1.3.7 fill, §23.1.3.31 splice, §23.1.3.35 toSpliced, §23.2.3 %TypedArray% methods and §22.1.3.22 String.prototype.slice"
trusted = ["Kani 0.68 / CBMC 6.11", "the ironhorse-spec models", "the harnesses"]

[[harness]]
guarantee = "NUM-6"
crate = "ironhorse-vm"
name = "numeric_kernel::proofs::num6_relative_index_matches_spec"
tier = "pr"
statement = "relative_index(f64::from_bits(b), len) <= len for every b, and == ironhorse_spec::relative_index(b, len) whenever the model accepts b (integral or infinite)."
domain = "every b: u64 and every len: u64 with len < 2^53 (assume); equality on the b the model accepts (integral or ±∞)"
unwind = 0
flags = []
time_budget_s = 17
memory_budget_gb = 1
unreachable = 0
mutants = ["NUM-6-a", "NUM-6-b"]
expect = "pass"
canary = false

[[guarantee]]
id = "NUM-7"
title = "binary64 to binary16 rounding and its round trip"
claim = "For every u64 bit pattern b, interp::f64_to_f16_bits(f64::from_bits(b)) equals the IEEE 754 roundTiesToEven binary16 model (NaN to 0x7E00, overflow to ±∞ of the sign); for every binary16 h, f16_bits_to_f64(h) has exactly the model's binary64 bits when h is not a NaN and is a NaN when h is; and f64_to_f16_bits(f16_bits_to_f64(h)) == h for every non-NaN h. This substantiates the kernel's claim that every host rounds alike."
spec = "ECMA-262 §21.3.2.17 Math.f16round steps 2-5, and the Float16 cases of §25.1.3.17 NumericToRawBytes and §25.1.3.15 RawBytesToNumeric (quoted in ironhorse-spec/src/float16.rs); IEEE 754-2019 §3.3, §4.3.1, §7.4"
trusted = ["Kani 0.68 / CBMC 6.11", "the ironhorse-spec models", "the harnesses"]

