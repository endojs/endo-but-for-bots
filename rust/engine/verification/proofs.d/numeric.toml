[[guarantee]]
id = "NUM-8"
title = "Typed-array element encode and decode"
claim = "For each integer element kind (Int8, Int16, Int32, Uint8, Uint16, Uint32, Uint8Clamped) and every u64 bit pattern b, encode_element_le(kind, b) stores exactly the little-endian bytes of the clause's conversion model (ToInt8 … ToUint32, ToUint8Clamp), and decode_element_le of those bytes is Integer(v) of the model value v, or Number(v) for a Uint32 above i32::MAX; for every byte pattern of the element width (all 2^8, 2^16 or 2^32), decode then encode returns the same bytes. Float64 stores a non-NaN Number's own bits and every NaN as 0x7FF8_0000_0000_0000, and decodes any 8 bytes to the Number with those bits (a NaN canonicalised, as Slot::number does); Float16 stores the NUM-7 rounding and decodes with the NUM-7 widening. Float32 is not covered."
spec = "ECMA-262 §25.1.3.17 NumericToRawBytes, §25.1.3.15 RawBytesToNumeric, the conversion operations of Table 71 (§7.1.6-§7.1.12)"
trusted = ["Kani 0.68 / CBMC 6.11", "the ironhorse-spec models", "the harnesses"]

