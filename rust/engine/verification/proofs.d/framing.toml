# Snapshot/bytecode framing, text and structural guarantees (SNAP, TXT, STR):
# designs/ironhorse-formal-verification.md, "Snapshot and bytecode framing",
# "Text" and "Structural invariants". Merged into proofs.toml by verify.py.
# Budgets are 3x the time measured on the development host (4 shared cores),
# at least 5 s; memory budgets are the measured peak rounded up.

[[guarantee]]
id = "SNAP-1"
title = "Atom container: total, tiling, round-tripping and canonical (bounded)"
claim = "On every input of up to 48 bytes AtomReader::parse does not panic, and when it accepts, the envelope is [len BE][XS_M] and the atoms tile buf[8..] exactly: each header is [8 + payload.len() BE][tag] and each payload is the sub-slice right after it, the last ending at buf.len(); the writer emits exactly that layout for one to three atoms with symbolic tags and contents and concrete payload lengths, and parse of its output returns the same (tag, payload) list or DuplicateAtom(first repeated tag), so an accepted container is the writer's encoding of its atoms (parse -> write canonicality); atom_size and appended_atom_size refuse exactly the sizes whose atom or envelope exceeds u32::MAX, for every usize; the pairwise duplicate scan names the first repeated tag (up to 4 tags). The BTreeSet duplicate shape (above 64 atoms) is tested, not proved."
spec = "ironhorse-snapshot/src/atom.rs AtomError::TrailingBytes: accepting a trailing tail \"would give one logical machine unboundedly many container encodings, and so unboundedly many CAS keys\"; DuplicateAtom: \"both non-canonical and a way to hide a payload behind one the reader prefers\"."
trusted = ["Kani 0.68 / CBMC 6.11", "the harnesses"]

[[guarantee]]
id = "SNAP-2"
title = "Slot record codec: total, round-tripping and canonical"
claim = "decode_slot is total on every 20-byte record and returns BadLength(len) on every other width up to 41 bytes; decode_slot(encode_slot(s)) is s with a NaN Number payload replaced by the canonical NaN, for every Slot, and re-encoding reproduces the bytes; an accepted record re-encodes to exactly its own 20 bytes unless its Number payload is a non-canonical NaN (the documented carve-out, refused for format >= 16 at the image gate)."
spec = "ironhorse-snapshot/src/slot_codec.rs layout table: \"9 | reserved (0)\", \"10..20 | payload data (tag-specific; unused bytes 0)\"; \"Encoding always zero-fills the record first, so a round-trip (write -> read -> write) is byte-identical\"; \"Decoding preserves legacy NaN bits; re-encoding normalizes them.\""
trusted = ["Kani 0.68 / CBMC 6.11", "the harnesses"]

[[guarantee]]
id = "SNAP-3"
title = "Fixed-format section decoders: total, exact, bounded reservation (bounded)"
claim = "The Cursor reads (u8, u16, u32, bytes(n) for any usize n) on buffers of up to 8 bytes succeed iff their bytes fit, return exactly them big-endian, advance by exactly their width and never past the end; be_u32_at/be_u64_at are exact on buffers of up to 12 bytes and any offset; decode_u32s (up to 16 bytes), Version::decode (up to 12), Signature::decode (up to 38) and the METR framing MeterImage::decode_fields (up to 64) do not panic and accept only payloads that re-encode to themselves (exact consumption); encode/decode round-trips for u32 lists of up to 3, every Version (iff readable), boot signatures with hosts of up to 2 ASCII bytes and meter images with version strings of up to 2 ASCII bytes; the list pre-reservation reserve_hint(count, len, width) is min(count, len / width) for every usize triple, so never more entries than the payload can hold."
spec = "ironhorse-fuzz snapshot_decoder.rs: from_snapshot_bytes \"must NEVER panic, hang, or allocate unboundedly\"; image.rs MeterImage::decode: \"Exact consumption\"; decode_u32s: \"a malformed `count` must not reserve gigabytes\"."
trusted = ["Kani 0.68 / CBMC 6.11", "the harnesses"]

[[guarantee]]
id = "SNAP-4"
title = "Bytecode instruction framing (bounded)"
claim = "instruction_len does not panic for any code of up to 6 bytes and any pc: usize; Some(l) implies l >= 1 and pc + l <= code.len(), with l the fixed size, 1 + ID_SIZE, or header width plus declared little-endian payload for the -1/-2/-4 sentinels; the width kernel prefixed_len is exact and panic-free in u32 (the usize of wasm32) and u64 for every header and u32 payload, fixing the 32-bit overflow; Opcode::from_u8 is total and round-trips; remap_ids on every 6-byte stream preserves length and changes only the two ID bytes after each ID-sentinel opcode of the walk, to the map's answer for the ID read there."
spec = "ironhorse-vm/src/opcode.rs instruction_len: \"This function never panics on malformed input; the bytecode-decoder fuzz target relies on it\"; WASM-BLOCKERS.md: overflow-checks panics on wasm32."
trusted = ["Kani 0.68 / CBMC 6.11", "the harnesses"]

[[guarantee]]
id = "TXT-1"
title = "CESU-8, WTF-8 and UTF-16 transcoder kernels (bounded; sequences tested)"
claim = "Per-unit and per-code-point kernels, proved on their whole domains: ironhorse-text encode_unit/decode_unit invert on every u16 (no zero byte) and decode_unit is total within its input on up to 3 bytes; json.rs code_point_units is UTF16EncodeCodePoint for every code point <= 0x10FFFF, wtf8_code_point is total on up to 4 bytes, decodes exactly the lead/continuation payload and never yields a value above 0x10FFFF, and inverts the WTF-8 encoding of every code point 0x80..=0x10FFFF; regexp cesu8_decode is CodePointAt on a high surrogate followed by any unit and utf8_decode/cesu8_decode invert every other non-NUL unit; big-endian units compare as the units do, and units_to_be16 preserves order on strings of lengths (1,2) and (2,2). The Vec-building wrappers (from_units/from_cesu8/to_units, cesu8_to_units, wtf8_to_units, units_to_be16 on longer strings) are tested, not proved: exhaustive single units, surrogate pairs, all code points, PRNG sequences up to 8 units."
spec = "ironhorse-text: \"Lossless JavaScript symbol spellings\"; interp/text.rs units_to_be16: \"a byte-lexicographic compare of two payloads equals their code-unit ordering\"; ECMA-262 11.1.1 UTF16EncodeCodePoint, 11.1.3 UTF16SurrogatePairToCodePoint, 11.1.4 CodePointAt, 7.2.13 IsLessThan."
trusted = ["Kani 0.68 / CBMC 6.11", "the harnesses"]

[[guarantee]]
id = "STR-1"
title = "Slot-arena free-list image acceptance (bounded)"
claim = "For every slot_count in 0..=4, every free list of up to 5 u32 entries and every live: u32, SlotArena::image_free_marks accepts iff the entries are distinct and below slot_count and free.len() + live == slot_count, and then marks exactly the free slots. try_from_image (which builds on it) and the counts beyond the bound are tested exhaustively, not proved; the FreeList extraction for alloc/free/mark/sweep preservation was not attempted."
spec = "ironhorse-vm/src/value.rs SlotArena::free_marks: \"kept in exact sync by every free-list writer\"; try_from_image: \"Rejects out-of-range and duplicate free entries and inconsistent counts.\""
trusted = ["Kani 0.68 / CBMC 6.11", "the harnesses"]

[[guarantee]]
id = "STR-2"
title = "Chunk-chain parser progress (bounded)"
claim = "On a plain chunk byte space of 24 symbolic bytes, for every total <= 24 and every header: usize, ChunkReader::checked_block_at does not panic and Ok((end, _)) implies header < end <= total, so free_chunk_for's chain walk terminates; chunk_allocation_fits equals header + 4 + payload < ceiling computed without overflow, for every usize triple."
spec = "ironhorse-vm/src/value.rs checked_block_at: \"Validate a whole chain block before using either its end or free tag\"; chunk_allocation_fits: \"The exclusive end must remain below the reserved NULL offset\"."
trusted = ["Kani 0.68 / CBMC 6.11", "the harnesses"]

[[guarantee]]
id = "STR-3"
title = "Regexp CharSet algebra (bounded)"
claim = "For well-formed endpoint lists of at most two ranges per side with boundaries in [-2^20, 2^20], the boundary-merge sweep extracted from charset_combine yields a well-formed list (even, strictly ascending) whose membership is the union, difference or intersection of the inputs' at every i32 x, and charset_contains (binary search) equals a linear scan on every well-formed set of up to two ranges. Metering is unchanged: the extraction leaves the work charge and node allocation in charset_combine."
spec = "ECMA-262 22.2.2 CharSet union, intersection and difference (CharacterClass evaluation); xsre.c fxCharSetCombine."
trusted = ["Kani 0.68 / CBMC 6.11", "the harnesses"]

