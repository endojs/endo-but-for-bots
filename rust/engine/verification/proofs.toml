# Kani proof manifest (VERIFICATION.md; designs/ironhorse-formal-verification.md).
# One [[harness]] entry per #[kani::proof] in the engine tree; `scripts/verify.py
# check` fails if the tree and this list differ. Time budgets are 3x the time
# measured on the development host (4 shared cores), at least 5 s; `run` warns
# past 1.5x and fails past 2x. Re-measure on the CI runner.
# `unreachable` pins the count of library-internal UNREACHABLE checks (R3);
# harness-own unreachable checks always fail. `flags` need `flags_reason` (R2).

kani_version = "0.68.0"

[[guarantee]]
id = "MTR-1"
title = "No panic from any restored meter state"
claim = "For every MeterState a snapshot can carry and every argument, no meter operation panics (with overflow-checks on, as in release); refunds are proved under their pairing precondition index >= n."
spec = "ironhorse-fuzz snapshot_decoder.rs: from_snapshot_bytes \"must NEVER panic, hang, or allocate unboundedly\"; Cargo.toml: \"Guest-influenced arithmetic must not silently wrap in shipped builds.\""
trusted = ["Kani 0.68 / CBMC 6.11", "the harnesses"]

[[guarantee]]
id = "MTR-2"
title = "Charging fails closed"
claim = "Ticks saturate exactly at u64::MAX; an unrepresentable admission is refused with index unchanged; index = u64::MAX is absorbing: no guest-driven operation leaves it and every check or admission from it refuses, armed or not."
spec = "ironhorse-vm/src/meter.rs Meter::charge_and_check: \"An unrepresentable total fails closed, even when checks are disabled; wrapping it would let guest work erase its accrued cost.\""
trusted = ["Kani 0.68 / CBMC 6.11", "the harnesses"]

[[guarantee]]
id = "MTR-3"
title = "Limit enforcement cannot be bypassed"
claim = "Armed, not exhausted and index > count: the host is consulted exactly once with computrons(); false gives Abort; Continue leaves count > index; an approved check whose next deadline is unrepresentable aborts (execution) or saturates the deadline (compilation). Un-armed meters never consult the host."
spec = "ironhorse-vm/src/meter.rs Meter::check: \"if metering is armed and the index passed the threshold, consult host\"; Meter::is_armed / interval: \"Zero disables checks\"."
trusted = ["Kani 0.68 / CBMC 6.11", "the harnesses"]

[[guarantee]]
id = "MTR-4"
title = "Unit relations"
claim = "computrons() = index >> 16; scale_interval(i) = min(i * 2^16, u64::MAX) and is nonzero iff i is; chunk_cost and string_chunk_cost equal their fxAdjustChunkSize formulas where representable and saturate otherwise."
spec = "ironhorse-vm/src/meter.rs scale_interval: \"Saturating keeps a non-zero interval non-zero, so the armed/un-armed distinction is never flipped by arithmetic.\"; Meter::tick_chunk_new: round_up_8(size) + 16; ironhorse-meter chunk_cost / string_chunk_cost."
trusted = ["Kani 0.68 / CBMC 6.11", "the harnesses"]

[[guarantee]]
id = "MTR-5"
title = "State and restore round trip"
claim = "restore(s); state() == s for every s, and last_reported feeds no computation, so leaving it out of MeterState is sound."
spec = "ironhorse-vm/src/meter.rs Meter::restore: \"last_reported is re-seeded from index for diagnostics; it feeds no computation.\""
trusted = ["Kani 0.68 / CBMC 6.11", "the harnesses"]

[[guarantee]]
id = "MTR-6"
title = "Monotone index, with its exact exceptions"
claim = "No guest-driven operation decreases index (checks never move it); a paired refund returns it to its value before the paired tick, or leaves it at u64::MAX if the tick exhausted the meter. begin and restore are the only other writers."
spec = "ironhorse-vm/src/meter.rs Meter::charge_and_check: \"would let guest work erase its accrued cost\"; Meter::check_compilation: \"Compilation receipts require a monotone accumulated index\"."
trusted = ["Kani 0.68 / CBMC 6.11", "the harnesses"]

[[guarantee]]
id = "KANI-1"
title = "Canary: Kani's float %, rem_euclid, powi and powf are wrong"
claim = "Each canary asserts the wrong value Kani 0.68 computes and so passes; a fix makes it fail, which forces review of rule R1 (no proof may depend on these operations)."
spec = "IEEE 754-2019 remainder/pow semantics as computed by rustc (true values in the harness comments)."
trusted = ["Kani 0.68 / CBMC 6.11"]

[[guarantee]]
id = "KANI-2"
title = "Canary: the runner detects a failed check"
claim = "A deliberately false assertion is reported as a failure; the manifest expects failure, so a runner that misses failures goes red."
spec = "scripts/verify.py rule: a harness whose result differs from expect fails the run."
trusted = ["Kani 0.68 / CBMC 6.11", "scripts/verify.py"]

