[package]
name = "ih-export-heap"
version = "0.0.0"
edition = "2021"
publish = false

# Native only: reads a Thixotrope `heap.sqlite` through the daemon-side SQLite
# backend and writes its canonical container, which the Durable Object imports.
[workspace]

[dependencies]
ironhorse-snapshot = { path = "../../ironhorse-snapshot" }
ironhorse-store-sqlite = { path = "../../../endo/ironhorse-store-sqlite" }

# A standalone cargo root outside the engine workspace, so it does not inherit
# `[workspace.lints]`; it states the unsafe policy itself (checked by
# scripts/test-crate-graph.py).
[lints.rust]
unsafe_code = "forbid"
