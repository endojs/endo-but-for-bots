[package]
name = "ih-wasm-worker-spike"
version = "0.0.0"
edition = "2021"
publish = false

# A standalone root, deliberately outside both workspaces: the wasm build uses
# the unstable panic=unwind workaround of WASM-BLOCKERS.md B1
# (RUSTC_BOOTSTRAP and -Zbuild-std), which the workspaces' --locked builds
# must not inherit. run.py seeds Cargo.lock from the repository root's
# before building; its comment there says why.
[workspace]

[lib]
crate-type = ["cdylib"]

# The product crates, and nothing that exports symbols of its own: the
# product wasm module (`thixotrope-ironhorse-wasm`) is deliberately not a
# dependency, since its `#[no_mangle]` exports would collide with the
# harness's.
[dependencies]
ironhorse-store-do = { path = "../ironhorse-store-do" }
thixotrope-ironhorse-core = { path = "../../thixotrope-ironhorse-core" }
# `consensus`, as the core asks for it, named here so the harness's feature
# set is visibly the product module's.
ironhorse-vm = { path = "../ironhorse-vm", features = ["consensus"] }
# `store-suite` compiles the backend acceptance suite into the library so the
# Durable Object can run it against `DoStore`.
ironhorse-snapshot = { path = "../ironhorse-snapshot", features = ["store-suite"] }

# Match the workspaces: guest-influenced arithmetic must not silently wrap.
[profile.release]
overflow-checks = true
