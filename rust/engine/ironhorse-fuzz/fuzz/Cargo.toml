# cargo-fuzz manifest for the ironhorse-fuzz targets (design § Fuzzability).
# Run locally with `cargo fuzz run <target>` from this directory (the sibling
# rust-toolchain.toml pins the nightly, so no `+nightly-…` is needed); not part of
# the engine workspace build (kept out via the parent's default-members). The
# comparison and generation logic lives in the ironhorse-fuzz lib, which the
# engine workspace builds and unit-tests without a libFuzzer toolchain.
#
# NOTE: both CI lanes read their roster from THIS FILE's `[[bin]]` names rather
# than naming a subset, so adding a target here is all it takes to have it
# fuzzed — by `ci.yml`'s `fuzz-ironhorse` tripwire on every engine-relevant
# pull request and by `ironhorse-deep-fuzz.yml` nightly. A garden background
# service drives them continuously as well. These targets remain fully
# runnable locally.
[package]
name = "ironhorse-fuzz-targets"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
ironhorse-fuzz = { path = ".." }
# The no-abort target drives the compiler and the VM directly (no oracle
# comparison), on a thread of the engine's documented stack size.
ironhorse-compile = { path = "../../ironhorse-compile" }
ironhorse-vm = { path = "../../ironhorse-vm" }

[[bin]]
name = "differential_source"
path = "fuzz_targets/differential_source.rs"
test = false
doc = false

[[bin]]
name = "bytecode_decoder"
path = "fuzz_targets/bytecode_decoder.rs"
