# Pinned nightly for the ironhorse-fuzz cargo-fuzz targets.
#
# With this file present, `cargo fuzz run <target>` from this `fuzz/` directory
# uses the pinned nightly automatically (no `+nightly-…` needed).
#
# The pin is duplicated in CI, which cannot read this file before it has a
# toolchain: `FUZZ_TOOLCHAIN` in `.github/workflows/ci.yml`'s `fuzz-ironhorse`
# job and in `.github/workflows/ironhorse-deep-fuzz.yml`. Three copies, bumped
# together, validated against the whole target set. This comment used to claim
# one source of truth and that fuzzing had moved out of pull-request CI; the
# tripwire is back (F039), so both statements are now the plain list above.
[toolchain]
channel = "nightly-2026-08-15"
profile = "minimal"
