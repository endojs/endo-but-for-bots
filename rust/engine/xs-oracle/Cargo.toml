[package]
name = "xs-oracle"
description = "Differential oracle: compiles JS to XS bytecode and runs it on XS, returning (bytecode, result, run-only computrons) for parity comparison. Dev/CI only; the sole engine crate that links unsafe C."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "xs_oracle"
path = "src/lib.rs"

[dependencies]
ironhorse-text = { path = "../ironhorse-text" }
# Keep the oracle's Number digits independent of ironhorse-vm's dtoa
# so a VM dtoa regression remains visible to the differential.
ryu = "1"

[build-dependencies]
cc = "1"

[dev-dependencies]
ironhorse-vm = { path = "../ironhorse-vm" }
proptest = { version = "1", default-features = false, features = ["std"] }
