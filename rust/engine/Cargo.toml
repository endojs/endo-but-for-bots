# Ironhorse engine workspace (design: designs/ironhorse-engine.md).
#
# Independent workspace nested under rust/engine so the oracle-locked
# transliteration of XS builds in-repo from the first commit (resolved
# question 9) without perturbing the existing rust/ workspace. The
# repo-root Cargo.toml excludes this path.
[workspace]
resolver = "2"
members = [
    "ironhorse-meter",
    "ironhorse-text",
    "ironhorse-unicode",
    "ironhorse-vm",
    "ironhorse-runtime",
    "xs-oracle",
    "ironhorse-262",
    "ironhorse-fuzz",
    "ironhorse-regexp",
    "ironhorse-compile",
    "ironhorse-snapshot",
]

[workspace.package]
version = "0.0.2"
edition = "2021"
license = "Apache-2.0"
publish = false

# Guest-influenced arithmetic must not silently wrap in shipped builds.
[profile.release]
overflow-checks = true

# Unsafe policy (design § Minimizing `unsafe`). `deny` rather than `forbid` so
# the few sanctioned sites can carry a scoped, commented
# `#[allow(unsafe_code)]`: the `xs-oracle` FFI crate root, the counting
# allocators of two ironhorse-vm test binaries, and the stack painter that
# `stack_height.rs` includes. Every library root other than xs-oracle keeps
# its own `#![forbid(unsafe_code)]`, which nothing inside it can relax.
# `scripts/test-crate-graph.py` asserts all of this, including that every
# member opts in with `[lints] workspace = true`.
[workspace.lints.rust]
unsafe_code = "deny"

# Incremental W0 gate: only warning families observed when the gate was
# introduced (Rust 1.88.0) are grandfathered; the gate now runs on the pinned
# toolchain (rust-toolchain.toml). New default Clippy warnings fail CI via
# -D warnings; remove these named allowances as each family is cleaned up.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Structural: fixing these reshapes signatures or error types.
result_large_err = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
# Fixing these renames methods (`to_*`/`into_*`/`is_*` receivers; inherent
# methods named like trait methods): an API change, not a syntactic one.
should_implement_trait = "allow"
wrong_self_convention = "allow"
# Not purely syntactic: the fix drops a temporary host allocation
# (`to_ascii_lowercase` -> `eq_ignore_ascii_case`, a `locale_language`
# `String`), or merges branches that transliterate XS's empty-then-branch
# idiom (regexp matcher), or rewrites a counter a macro also advances.
explicit_counter_loop = "allow"
if_same_then_else = "allow"
manual_ignore_case_cmp = "allow"
