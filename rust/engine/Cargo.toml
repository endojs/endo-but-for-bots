# Ironhorse engine workspace (design: designs/ironhorse-engine.md).
#
# Independent workspace nested under rust/engine so the oracle-locked
# transliteration of XS builds in-repo from the first commit (resolved
# question 9) without perturbing the existing rust/ workspace. The
# repo-root Cargo.toml excludes this path.
[workspace]
resolver = "2"
members = [
    "ironhorse-vm",
    "xs-oracle",
    "ironhorse-262",
    "ironhorse-fuzz",
    "ironhorse-regexp",
    "ironhorse-compile",
    "ironhorse-snapshot",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "Apache-2.0"
publish = false

# Guest-influenced arithmetic must not silently wrap in shipped builds.
[profile.release]
overflow-checks = true

# Incremental W0 gate: only warning families observed with Rust 1.88.0
# are grandfathered. New default Clippy warnings fail CI via -D warnings;
# remove these named allowances as each family is cleaned up.
[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
collapsible_else_if = "allow"
collapsible_if = "allow"
default_constructed_unit_structs = "allow"
doc_lazy_continuation = "allow"
explicit_counter_loop = "allow"
field_reassign_with_default = "allow"
get_first = "allow"
if_same_then_else = "allow"
iter_kv_map = "allow"
let_unit_value = "allow"
manual_contains = "allow"
manual_find = "allow"
manual_ignore_case_cmp = "allow"
manual_is_ascii_check = "allow"
manual_range_contains = "allow"
manual_range_patterns = "allow"
map_entry = "allow"
needless_as_bytes = "allow"
needless_borrow = "allow"
needless_late_init = "allow"
needless_lifetimes = "allow"
needless_question_mark = "allow"
needless_range_loop = "allow"
nonminimal_bool = "allow"
only_used_in_recursion = "allow"
redundant_closure = "allow"
redundant_guards = "allow"
redundant_pattern_matching = "allow"
redundant_slicing = "allow"
result_large_err = "allow"
should_implement_trait = "allow"
single_char_add_str = "allow"
single_match = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
uninlined_format_args = "allow"
unnecessary_cast = "allow"
unnecessary_map_or = "allow"
while_let_loop = "allow"
wrong_self_convention = "allow"
