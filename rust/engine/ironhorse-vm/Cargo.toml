[package]
name = "ironhorse-vm"
description = "Safe, index-arena transliteration of the XS interpreter core: value/heap model, slot stack, match-dispatch interpreter, and the 16.16 fixed-point meter. #![forbid(unsafe_code)]."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "ironhorse_vm"
path = "src/lib.rs"

[dependencies]
ironhorse-meter = { path = "../ironhorse-meter" }
ironhorse-text = { path = "../ironhorse-text" }
# The engine-internal XSRE matcher (child 8). ironhorse-vm links it as the
# JavaScript `RegExp` surface (child 9): construction compiles a pattern
# with `compile`, and `exec`/`test`/the String regex methods drive
# `match_regexp`. Both halves are `#![forbid(unsafe_code)]`.
ironhorse-regexp = { path = "../ironhorse-regexp" }
icu_normalizer = "=2.2.0"
icu_segmenter = "=2.2.0"

[dev-dependencies]
# Source-level regression locks (`tests/`) need guest JS turned into
# bytecode + a symbols atom, and the portable fuzz regressions compile
# their generated source the same way. `ironhorse-compile` is the
# pure-Rust half of the pipeline `dual_run` rides, so both need neither
# XS nor c/moddable nor libclang; it does not depend on this crate, so
# the edge is not a cycle.
ironhorse-compile = { path = "../ironhorse-compile" }

[features]
# Off by default; only the isolated test-ironhorse-calibration CI job and local
# instrumentation runs enable this. Consensus builds reject the feature.
# No timing driver exists yet. The disabled recorder is zero-sized; the planned
# instruction-identical object-code firewall proof is not established by that test.
default = []
cost-calibration = []
# Shipping workers opt in; instrumentation cannot unify into this configuration.
consensus = []
# Validate counted bulk roots against a full walk before partial collection,
# including release builds. The worker enables this integrity boundary.
store-integrity = []
