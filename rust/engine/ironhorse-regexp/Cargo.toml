[package]
name = "ironhorse-regexp"
description = "Safe transliteration of the XS RegExp engine (xsre.c): the pattern compiler (parser + measure + code emission) and the backtracking match VM, engine-internal (no JavaScript surface). Metering-exact and bit-exact against the c/moddable pin. #![forbid(unsafe_code)]."
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[lib]
name = "ironhorse_regexp"
path = "src/lib.rs"

[dependencies]
# Cargo does not support optional dev-dependencies; keep the C oracle off
# the default graph and enable it only for the parity integration target.
xs-oracle = { path = "../xs-oracle", optional = true }

[features]
parity = ["dep:xs-oracle"]

[[test]]
name = "parity"
required-features = ["parity"]
