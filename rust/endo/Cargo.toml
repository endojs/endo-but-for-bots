[package]
name = "endo"
version = "0.1.0"
edition = "2021"


[dependencies.ironhorse-vm]
path = '../engine/ironhorse-vm'
optional = true

[dependencies.ironhorse-compile]
path = '../engine/ironhorse-compile'
optional = true

[dependencies.ironhorse-snapshot]
path = '../engine/ironhorse-snapshot'
optional = true

[dependencies.ironhorse-store-sqlite]
path = 'ironhorse-store-sqlite'
optional = true

[features]
# The Ironhorse engine is linked in by default so the one `endor` binary
# carries both engines through the parity campaign (design
# designs/ironhorse-engine.md § Endor integration). Build with
# --no-default-features to get an XS-only binary. The snapshot/store
# crates ride the same feature: they are the engine's heap-persistence
# seam (designs/ironhorse-snapshot-store-seam.md § supervisor wiring).
default = ['ironhorse-engine']
ironhorse-engine = ['ironhorse-vm', 'ironhorse-compile', 'ironhorse-snapshot', 'ironhorse-store-sqlite']
[dependencies]
base64 = "0.22"
endo_iroh = { path = "../endo_iroh" }
flate2 = "1"
gix = { version = "0.85", default-features = false, features = ["parallel", "sha1", "sha256"] }
hex = "0.4"
libc = "0.2"
rusqlite = { version = "0.31", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "signal", "process", "io-util", "net", "time"] }
ureq = "2"
xsnap = { path = "xsnap" }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
tempfile = "3"

[[bin]]
name = "endor"
path = "src/bin/endor.rs"

[[bench]]
name = "codec"
harness = false
