# The Slot Machine per-worker write-ahead transcript
# (designs/ironhorse-panic.md § Slot Machine per-worker write-ahead
# transcript). A sibling crate rather than an endo module so it builds and
# tests without the XS C toolchain the xsnap crate needs, and without the
# engine crates: the transcript is supervisor state, not engine state.
[package]
name = "slot-machine-transcript"
version = "0.1.0"
edition = "2021"

[dependencies]
rusqlite = { version = "0.31", features = ["bundled"] }
sha2 = "0.10"
hex = "0.4"

[dev-dependencies]
tempfile = "3"
