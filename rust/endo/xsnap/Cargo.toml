[package]
name = "xsnap"
version = "0.1.0"
edition = "2021"
publish = false
description = "Rust bindings for the XS JavaScript engine (Moddable)"

[dependencies]
cap-std = "3"
sha2 = "0.10"
rand = "0.8"
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
url = "2"
# `fallible_uint` keeps the u64/usize conversions rusqlite 0.31 had built in
# (range-checked against i64 when binding and reading).
rusqlite = { version = "0.43", features = ["bundled", "fallible_uint"] }

[features]
debug = []

[build-dependencies]
cc = "1"

[dev-dependencies]
tempfile = "3"
criterion = { version = "0.5", features = ["html_reports"] }
os_pipe = "1"
endo = { path = ".." }

[[bench]]
name = "xs_engine"
harness = false

[[bench]]
name = "transport"
harness = false

[lints]
workspace = true
