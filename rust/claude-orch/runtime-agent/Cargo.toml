[package]
name = "claude-orch-runtime-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "claude-agent"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
# `seccompiler` is linux-only by construction; the runtime-agent only
# ships in linux guests (x86_64-unknown-linux-musl per build-image.sh),
# so the default feature set includes it. A `--no-default-features`
# build still compiles for local dev / cross-target check without
# requiring the seccompiler crate.
seccompiler = { version = "0.4", optional = true }

[features]
default = ["seccomp"]
seccomp = ["dep:seccompiler"]
