[package]
name = "claude-orch-runtime-agent"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "claude-agent"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
# `seccompiler` and the `seccomp` feature gate are linux-only by
# construction. Default features stay empty so plain `cargo check` /
# rust-analyzer on macOS+Windows hosts can compile the crate without
# pulling in Linux-only constants (`PR_SET_NO_NEW_PRIVS`, x86-specific
# syscall numbers, etc.). The guest image build (`build-image.sh` and
# `smoke-boot.sh`) explicitly passes `--features seccomp` so the
# filter is in every shipping binary.
seccompiler = { version = "0.4", optional = true }

[features]
default = []
seccomp = ["dep:seccompiler"]
